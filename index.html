<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livro Vivo 3D — História Interativa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; color: #fff; }

    /* Camada de Texto no Fundo (Rola continuamente) */
    #background-text-layer {
      position: fixed; inset: 0; z-index: 1; padding: 90px 12% 180px;
      overflow-y: auto; background: radial-gradient(circle at center, #162038 0%, #090d16 100%);
      transition: opacity 0.4s ease;
    }
    #background-text-content {
      max-width: 820px; margin: 0 auto; font-size: 1.35rem; line-height: 1.9;
      color: rgba(255, 255, 255, 0.35);
    }
    .segment-span { transition: all 0.3s ease; padding: 2px 6px; border-radius: 6px; }
    .segment-span.active {
      color: #ffffff; background: rgba(245, 158, 11, 0.22);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
    }

    /* Palco 3D por cima do texto */
    #canvas-container {
      position: fixed; inset: 0; z-index: 2; transition: opacity 0.45s ease, visibility 0.45s;
    }
    #canvas-container.hidden-stage { opacity: 0; pointer-events: none; visibility: hidden; }

    /* Balões 3D Projetados na Tela */
    #bubbles-layer { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
    .speech-bubble {
      position: absolute; transform: translate(-50%, -100%);
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 14px;
      padding: 10px 14px; max-width: 260px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: opacity 0.25s ease;
    }
    .speech-bubble::after {
      content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      border-width: 8px 8px 0; border-style: solid;
      border-color: rgba(15, 23, 42, 0.9) transparent transparent transparent;
    }
    .bubble-name {
      display: inline-block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 2px 8px; border-radius: 6px; margin-bottom: 5px;
    }
    .bubble-text { font-size: 0.92rem; line-height: 1.35; color: #f8fafc; }

    /* Barra Superior */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 22px; background: linear-gradient(to bottom, rgba(8,12,22,0.88), transparent);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-size: 1.2rem; font-weight: 800; color: #fbbf24; }
    .page-badge {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
      padding: 4px 12px; border-radius: 999px; font-size: 0.82rem;
    }
    .scene-tag {
      background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.45);
      color: #6ee7b7; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem;
    }

    /* Botão 3 Pontinhos e Dropdown */
    .menu-wrapper { position: relative; }
    #dots-btn {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25);
      background: rgba(15, 23, 42, 0.85); color: #fff; font-size: 1.4rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px);
    }
    #dots-btn:hover { background: rgba(245, 158, 11, 0.3); border-color: #fbbf24; }
    #dropdown-menu {
      position: absolute; top: 50px; right: 0; width: 245px;
      background: rgba(15, 23, 42, 0.96); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px; padding: 8px; display: none; flex-direction: column; gap: 4px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.65); backdrop-filter: blur(12px);
    }
    #dropdown-menu.open { display: flex; }
    .menu-item {
      background: transparent; border: none; color: #f1f5f9; text-align: left;
      padding: 10px 12px; border-radius: 9px; font-size: 0.9rem; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
    }
    .menu-item:hover { background: rgba(255,255,255,0.1); }

    /* HUD Inferior */
    #hud-bottom {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      padding: 16px 24px 20px;
      background: linear-gradient(to top, rgba(6, 9, 18, 0.96) 65%, transparent);
      display: flex; flex-direction: column; gap: 12px;
    }
    #narration-box {
      max-width: 900px; margin: 0 auto; width: 100%;
      background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px; padding: 10px 16px; display: flex; align-items: center; gap: 14px;
      backdrop-filter: blur(10px);
    }
    .narrator-avatar {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
      border: 2px solid #93c5fd;
    }
    #speaker-label { font-size: 0.78rem; font-weight: 700; color: #fbbf24; text-transform: uppercase; }
    #subtitle-text { font-size: 0.96rem; color: #e2e8f0; margin-top: 2px; }

    /* Controles e Barra Arrastável */
    .controls-row {
      max-width: 900px; margin: 0 auto; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 14px;
    }
    .ctrl-btn {
      background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 8px 18px; border-radius: 999px; font-size: 0.88rem;
      font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .ctrl-btn:hover { background: #f59e0b; color: #0f172a; border-color: #fbbf24; }
    .ctrl-btn.primary { background: #fbbf24; color: #0f172a; border-color: #fbbf24; }

    .progress-row {
      max-width: 900px; margin: 0 auto; width: 100%;
      display: flex; align-items: center; gap: 12px; font-size: 0.82rem; color: #cbd5e1;
    }
    #progress-slider {
      flex: 1; -webkit-appearance: none; height: 7px; border-radius: 999px;
      background: rgba(255,255,255,0.2); outline: none; cursor: pointer;
    }
    #progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: #fbbf24; border: 2px solid #fff; cursor: grab;
    }

    /* Modal Editor de Texto e Páginas */
    #editor-modal {
      position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 20px;
    }
    #editor-modal.open { display: flex; }
    .modal-card {
      background: #111827; border: 1px solid rgba(255,255,255,0.18); border-radius: 18px;
      width: 100%; max-width: 640px; padding: 22px; display: flex; flex-direction: column; gap: 14px;
    }
    .modal-card h2 { color: #fbbf24; font-size: 1.2rem; }
    .modal-card input, .modal-card textarea {
      width: 100%; background: #1f2937; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; color: #fff; padding: 10px 12px; font-size: 0.95rem;
    }
    .modal-card textarea { height: 200px; resize: vertical; line-height: 1.5; }
    .pages-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .page-chip {
      padding: 5px 12px; border-radius: 8px; background: #1f2937; border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1; cursor: pointer; font-size: 0.82rem;
    }
    .page-chip.active { background: #fbbf24; color: #0f172a; font-weight: 700; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  </style>
</head>
<body>

  <!-- Texto no Fundo (pode ser revelado limpando as imagens 3D) -->
  <div id="background-text-layer">
    <div id="background-text-content"></div>
  </div>

  <!-- Palco 3D -->
  <div id="canvas-container"></div>

  <!-- Balões de Fala 3D -->
  <div id="bubbles-layer"></div>

  <!-- Cabeçalho -->
  <header>
    <div class="brand">
      <span class="brand-title">📖 Livro Vivo 3D</span>
      <span class="page-badge" id="page-indicator">Página 1 de 2</span>
      <span class="scene-tag" id="scene-indicator">Cenário: Castelo &amp; Floresta</span>
    </div>

    <div class="menu-wrapper">
      <button id="dots-btn" title="Opções">⋮</button>
      <div id="dropdown-menu">
        <button class="menu-item" id="btn-open-editor">➕ Adicionar / Editar Texto</button>
        <button class="menu-item" id="btn-add-page">📄 Adicionar Nova Página</button>
        <button class="menu-item" id="btn-toggle-stage">👁️ Limpar Imagens (Ver Só Texto)</button>
        <button class="menu-item" id="btn-cycle-bg">🏞️ Trocar Paisagem Manualmente</button>
      </div>
    </div>
  </header>

  <!-- HUD Inferior -->
  <div id="hud-bottom">
    <div id="narration-box">
      <div class="narrator-avatar" id="speaker-icon">🧙‍♂️</div>
      <div>
        <div id="speaker-label">Narrador</div>
        <div id="subtitle-text">Pressione Iniciar para começar a história interativa...</div>
      </div>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn" id="btn-prev">⏮ Voltar</button>
      <button class="ctrl-btn primary" id="btn-play-pause">▶ Iniciar</button>
      <button class="ctrl-btn" id="btn-next">Avançar ⏭</button>
    </div>

    <div class="progress-row">
      <span id="time-remaining">Faltam 00:00</span>
      <input type="range" id="progress-slider" min="0" max="100" value="0" step="1" />
      <span id="percent-label">0%</span>
    </div>
  </div>

  <!-- Modal de Texto e Páginas -->
  <div id="editor-modal">
    <div class="modal-card">
      <h2>Editar História e Páginas</h2>
      <div class="pages-bar" id="modal-pages-bar"></div>
      <input type="text" id="page-title-input" placeholder="Descrição ou título desta página..." />
      <textarea id="page-text-input" placeholder="Escreva aqui. Use Nome: fala para diálogos (ex: Maria: Olá!). Símbolos como @ ou * serão limpos automaticamente."></textarea>
      <div class="modal-actions">
        <button class="ctrl-btn" id="btn-close-modal">Cancelar</button>
        <button class="ctrl-btn primary" id="btn-save-story">Salvar e Encenar</button>
      </div>
    </div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // =========================================================
    // 1. DADOS INICIAIS DO LIVRO (MÚLTIPLAS PÁGINAS)
    // =========================================================
    let pages = [
      {
        title: "Capítulo 1: O Encontro no Reino",
        text: `O vento soprava suave entre as árvores antigas do castelo enquanto o sol iluminava o vale.
Maria: Precisamos atravessar a floresta antes que o exército inimigo chegue às montanhas!
João: Não tenha medo, Maria. Nossos soldados já estão posicionados perto do rio.
Antônia: Eu conheço um atalho secreto pela água que nos levará direto ao topo da montanha!
Durante a caminhada pela floresta, o silêncio voltou a reinar sobre as copas das árvores e o riacho cristalino.`
      },
      {
        title: "Capítulo 2: A Marcha nas Montanhas",
        text: `As montanhas altas cobriam o horizonte com névoa densa e frio intenso.
João: Vejam lá embaixo! O exército se aproxima pelo vale.
Maria: Mantenham a calma. Vamos seguir juntos até o amanhecer.
A guerra estava prestes a começar, mas a coragem daqueles viajantes ecoava por toda a montanha.`
      }
    ];

    let currentPageIndex = 0;
    let segments = [];
    let currentSegIndex = 0;
    let isPlaying = false;
    let stageVisible = true;
    let availableVoices = [];

    // =========================================================
    // 2. LIMPEZA DE TEXTO E PARSER DE PERSONAGENS
    // =========================================================
    function cleanSpokenText(raw) {
      // Remove @, *, #, _, ~, colchetes e caracteres desnecessários mantendo pontuação básica
      return raw
        .replace(/[@*#_~`^<>[\]{}|\\]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function guessGender(name) {
      const n = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const femaleExceptions = ['alice', 'beatriz', 'raquel', 'rute', 'ester', 'iris', 'ines', 'carmen', 'luz', 'flor'];
      const maleExceptions = ['luca', 'noa', 'joshua', 'nikita'];
      if (maleExceptions.includes(n)) return 'M';
      if (femaleExceptions.includes(n)) return 'F';
      return n.endsWith('a') ? 'F' : 'M';
    }

    function hashColor(name) {
      const palette = ['#e11d48', '#2563eb', '#9333ea', '#059669', '#d97706', '#0891b2'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return palette[Math.abs(hash) % palette.length];
    }

    function detectTheme(text) {
      const t = text.toLowerCase();
      if (/guerra|batalha|espada|ataque/.test(t)) return 'guerra';
      if (/montanha|serra|pico|rocha/.test(t)) return 'montanha';
      if (/água|agua|rio|mar|lago|riacho/.test(t)) return 'agua';
      if (/floresta|árvore|arvore|bosque|mata/.test(t)) return 'floresta';
      return 'castelo';
    }

    function hasArmyKeyword(text) {
      return /exército|exercito|soldado|soldados|tropa|tropas|guerra/.test(text.toLowerCase());
    }

    function parsePageSegments(pageText) {
      const lines = pageText.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const characterMap = {};
      let femaleCount = 0, maleCount = 0;

      const parsed = lines.map((line, idx) => {
        const match = line.match(/^([A-ZÀ-Ú][a-zà-úA-ZÀ-Ú0-9\s]{1,22}):\s*(.+)$/);
        if (match) {
          const speaker = cleanSpokenText(match[1]);
          const spoken = cleanSpokenText(match[2]);
          if (!characterMap[speaker]) {
            const gender = guessGender(speaker);
            const pitchOffset = gender === 'F' ? (1.15 + (femaleCount++ % 4) * 0.14) : (0.88 - (maleCount++ % 4) * 0.1);
            characterMap[speaker] = {
              name: speaker,
              gender,
              color: hashColor(speaker),
              pitch: Math.max(0.6, Math.min(1.65, pitchOffset)),
              rate: 0.98 + ((femaleCount + maleCount) % 3) * 0.05
            };
          }
          return {
            index: idx,
            type: 'dialogue',
            speaker,
            charInfo: characterMap[speaker],
            text: spoken,
            theme: detectTheme(spoken),
            army: hasArmyKeyword(spoken)
          };
        } else {
          const cleaned = cleanSpokenText(line);
          return {
            index: idx,
            type: 'narration',
            speaker: 'Narrador',
            charInfo: null,
            text: cleaned,
            theme: detectTheme(cleaned),
            army: hasArmyKeyword(cleaned)
          };
        }
      });

      // Detectar interlocutores (quem fala e quem responde na sequência)
      for (let i = 0; i < parsed.length; i++) {
        if (parsed[i].type === 'dialogue') {
          const participants = new Set([parsed[i].speaker]);
          if (i + 1 < parsed.length && parsed[i + 1].type === 'dialogue') {
            participants.add(parsed[i + 1].speaker);
          } else if (i - 1 >= 0 && parsed[i - 1].type === 'dialogue') {
            participants.add(parsed[i - 1].speaker);
          }
          parsed[i].participants = Array.from(participants);
        } else {
          parsed[i].participants = [];
        }
      }

      return { parsed, characters: Object.values(characterMap) };
    }

    // =========================================================
    // 3. MOTOR 3D (THREE.JS) — CENÁRIOS, ÁRVORES, AVATARES E SOLDADOS
    // =========================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1e293b, 0.022);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 4.2, 11.5);
    camera.lookAt(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Luzes
    const hemiLight = new THREE.HemisphereLight(0xfffbeb, 0x1e293b, 1.1);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff3c4, 1.3);
    dirLight.position.set(8, 16, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Chão
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grupos de Cenário
    const envGroup = new THREE.Group();
    const treesGroup = new THREE.Group();
    const mountainsGroup = new THREE.Group();
    const waterMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 18),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2, metalness: 0.5 })
    );
    waterMesh.rotation.x = -Math.PI / 2;
    waterMesh.position.set(0, 0.03, -12);
    waterMesh.visible = false;

    scene.add(envGroup, treesGroup, mountainsGroup, waterMesh);

    // Criar Árvores Básicas para Clima
    function createTree(x, z, scale = 1) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18 * scale, 0.26 * scale, 1.5 * scale, 8),
        new THREE.MeshStandardMaterial({ color: 0x5c3a21 })
      );
      trunk.position.y = 0.75 * scale;
      const crown = new THREE.Mesh(
        new THREE.ConeGeometry(1.1 * scale, 2.6 * scale, 8),
        new THREE.MeshStandardMaterial({ color: 0x15803d })
      );
      crown.position.y = 2.3 * scale;
      tree.add(trunk, crown);
      tree.position.set(x, 0, z);
      return tree;
    }

    const treeCoords = [[-8, -4], [-6, -9], [7, -5], [9, -10], [-11, 1], [11, 2], [-3, -14], [4, -15]];
    treeCoords.forEach(([x, z], i) => treesGroup.add(createTree(x, z, 0.9 + (i % 3) * 0.25)));

    // Criar Montanhas ao Fundo
    function createMountain(x, z, radius, height) {
      const m = new THREE.Mesh(
        new THREE.ConeGeometry(radius, height, 6),
        new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.95 })
      );
      m.position.set(x, height / 2 - 0.2, z);
      return m;
    }
    mountainsGroup.add(
      createMountain(-14, -26, 9, 14),
      createMountain(0, -30, 12, 18),
      createMountain(15, -25, 10, 15)
    );

    const themesList = ['castelo', 'floresta', 'montanha', 'agua', 'guerra'];
    let currentTheme = 'castelo';

    function applySceneTheme(theme) {
      currentTheme = theme;
      document.getElementById('scene-indicator').textContent = `Cenário: ${theme.toUpperCase()}`;
      waterMesh.visible = (theme === 'agua');
      mountainsGroup.visible = (theme === 'montanha' || theme === 'castelo' || theme === 'guerra');
      treesGroup.visible = true;

      if (theme === 'floresta') {
        scene.background = new THREE.Color(0x143326);
        scene.fog.color.setHex(0x143326);
        groundMat.color.setHex(0x1e4620);
      } else if (theme === 'montanha') {
        scene.background = new THREE.Color(0x334155);
        scene.fog.color.setHex(0x334155);
        groundMat.color.setHex(0x4b5563);
      } else if (theme === 'agua') {
        scene.background = new THREE.Color(0x0c4a6e);
        scene.fog.color.setHex(0x0c4a6e);
        groundMat.color.setHex(0x2e6f40);
      } else if (theme === 'guerra') {
        scene.background = new THREE.Color(0x3b1717);
        scene.fog.color.setHex(0x3b1717);
        groundMat.color.setHex(0x3f2e26);
      } else {
        scene.background = new THREE.Color(0x1e293b);
        scene.fog.color.setHex(0x1e293b);
        groundMat.color.setHex(0x2d5a27);
      }
    }

    // =========================================================
    // 4. CONSTRUTOR DE AVATARES 3D E SOLDADOS
    // =========================================================
    const avatarsMap = {};
    const soldiersGroup = new THREE.Group();
    scene.add(soldiersGroup);

    function buildAvatarMesh(charInfo) {
      const group = new THREE.Group();
      const bodyColor = new THREE.Color(charInfo.color);

      // Tronco
      const torsoGeo = charInfo.gender === 'F'
        ? new THREE.CylinderGeometry(0.32, 0.55, 1.35, 12)
        : new THREE.CylinderGeometry(0.45, 0.38, 1.4, 12);
      const torso = new THREE.Mesh(torsoGeo, new THREE.MeshStandardMaterial({ color: bodyColor }));
      torso.position.y = 1.25;
      torso.castShadow = true;

      // Cabeça
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.36, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xfcd34d })
      );
      head.position.y = 2.25;
      head.castShadow = true;

      // Detalhe de cabelo/coroa para diferenciar
      const hair = new THREE.Mesh(
        new THREE.SphereGeometry(0.38, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55),
        new THREE.MeshStandardMaterial({ color: charInfo.gender === 'F' ? 0x451a03 : 0x1e293b })
      );
      hair.position.y = 2.3;

      // Pernas
      const legMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.7, 8), legMat);
      leftLeg.position.set(-0.18, 0.35, 0);
      const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.7, 8), legMat);
      rightLeg.position.set(0.18, 0.35, 0);

      group.add(torso, head, hair, leftLeg, rightLeg);
      group.visible = false;
      scene.add(group);

      return {
        mesh: group,
        leftLeg,
        rightLeg,
        info: charInfo,
        baseX: 0,
        targetX: 0,
        phase: Math.random() * Math.PI * 2
      };
    }

    // Criar Soldados do Exército
    for (let i = 0; i < 10; i++) {
      const soldier = buildAvatarMesh({ name: 'Soldado', gender: 'M', color: '#64748b' });
      const row = Math.floor(i / 5);
      const col = (i % 5) - 2;
      soldier.mesh.position.set(col * 2.2, 0, -5.5 - row * 2.2);
      soldier.mesh.scale.set(0.88, 0.88, 0.88);
      soldiersGroup.add(soldier.mesh);
      soldier.mesh.visible = true;
    }
    soldiersGroup.visible = false;

    function rebuildCharacters(characters) {
      Object.values(avatarsMap).forEach(a => scene.remove(a.mesh));
      for (const key in avatarsMap) delete avatarsMap[key];

      characters.forEach((c) => {
        avatarsMap[c.name] = buildAvatarMesh(c);
      });
    }

    // =========================================================
    // 5. SÍNTESE DE VOZ (WEB SPEECH API)
    // =========================================================
    function loadVoices() {
      availableVoices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function pickVoiceForGender(gender) {
      const ptVoices = availableVoices.filter(v => v.lang.toLowerCase().includes('pt'));
      if (!ptVoices.length) return null;
      if (gender === 'F') {
        return ptVoices.find(v => /maria|luciana|francisca|female|mulher|google português/i.test(v.name)) || ptVoices[0];
      } else {
        return ptVoices.find(v => /daniel|antonio|felipe|male|homem/i.test(v.name)) || ptVoices[ptVoices.length - 1];
      }
    }

    function speakSegment(seg, onDone) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(seg.text);
      utterance.lang = 'pt-BR';

      if (seg.type === 'dialogue' && seg.charInfo) {
        const v = pickVoiceForGender(seg.charInfo.gender);
        if (v) utterance.voice = v;
        utterance.pitch = seg.charInfo.pitch;
        utterance.rate = seg.charInfo.rate;
      } else {
        // Voz de Narrador
        const v = pickVoiceForGender('M');
        if (v) utterance.voice = v;
        utterance.pitch = 0.82;
        utterance.rate = 0.96;
      }

      utterance.onend = () => { if (isPlaying) onDone(); };
      utterance.onerror = () => { if (isPlaying) onDone(); };
      window.speechSynthesis.speak(utterance);
    }

    // =========================================================
    // 6. DIREÇÃO DE CENA, BALÕES E CONTROLE DE PROGRESSO
    // =========================================================
    const bubblesLayer = document.getElementById('bubbles-layer');

    function updateSceneForSegment(seg) {
      // Atualizar texto de fundo destacado
      document.querySelectorAll('.segment-span').forEach((el, idx) => {
        el.classList.toggle('active', idx === seg.index);
        if (idx === seg.index) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      // Mudar paisagem conforme palavra-chave
      applySceneTheme(seg.theme);

      // Limpar balões antigos
      bubblesLayer.innerHTML = '';

      if (seg.type === 'narration') {
        // Na narração, os personagens e soldados desaparecem para mostrar a paisagem
        Object.values(avatarsMap).forEach(a => a.mesh.visible = false);
        soldiersGroup.visible = false;

        document.getElementById('speaker-icon').textContent = '🧙‍♂️';
        document.getElementById('speaker-label').textContent = 'Narrador';
        document.getElementById('subtitle-text').textContent = seg.text;
      } else {
        // Diálogo: exibir quem fala e quem responde
        const activeNames = seg.participants;
        Object.values(avatarsMap).forEach(a => { a.mesh.visible = false; });

        activeNames.forEach((name, idx) => {
          const av = avatarsMap[name];
          if (!av) return;
          av.mesh.visible = true;
          const spread = activeNames.length === 1 ? 0 : (idx === 0 ? -1.7 : 1.7);
          av.baseX = spread;
          av.mesh.position.set(spread, 0, 0.8);
        });

        // Exército aparece apenas se mencionado e fora da narração
        soldiersGroup.visible = seg.army;

        document.getElementById('speaker-icon').textContent = seg.charInfo.gender === 'F' ? '👸' : '🤴';
        document.getElementById('speaker-label').textContent = seg.speaker;
        document.getElementById('subtitle-text').textContent = seg.text;

        // Criar balão flutuante para quem está falando agora
        const bubble = document.createElement('div');
        bubble.className = 'speech-bubble';
        bubble.id = 'active-speech-bubble';
        bubble.innerHTML = `
          <div class="bubble-name" style="background:${seg.charInfo.color}">${seg.speaker}</div>
          <div class="bubble-text">${seg.text}</div>
        `;
        bubblesLayer.appendChild(bubble);
      }

      updateProgressUI();
    }

    function updateProgressUI() {
      const total = segments.length || 1;
      const pct = Math.round(((currentSegIndex + 1) / total) * 100);
      document.getElementById('progress-slider').value = pct;
      document.getElementById('percent-label').textContent = `${pct}%`;

      // Estimativa de tempo restante (~13 caracteres por segundo)
      const remainingChars = segments.slice(currentSegIndex).reduce((acc, s) => acc + s.text.length, 0);
      const totalSec = Math.max(0, Math.ceil(remainingChars / 13));
      const mins = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      document.getElementById('time-remaining').textContent = `Faltam ${mins}:${secs}`;
    }

    function playCurrentStep() {
      if (!segments.length) return;
      const seg = segments[currentSegIndex];
      updateSceneForSegment(seg);

      if (isPlaying) {
        speakSegment(seg, () => {
          if (currentSegIndex < segments.length - 1) {
            currentSegIndex++;
            playCurrentStep();
          } else if (currentPageIndex < pages.length - 1) {
            // Avança automaticamente para a próxima página
            loadPage(currentPageIndex + 1, true);
          } else {
            isPlaying = false;
            document.getElementById('btn-play-pause').textContent = '▶ Reiniciar';
          }
        });
      }
    }

    function loadPage(index, autoStart = false) {
      currentPageIndex = index;
      const page = pages[index];
      document.getElementById('page-indicator').textContent = `Página ${index + 1} de ${pages.length}`;

      const { parsed, characters } = parsePageSegments(page.text);
      segments = parsed;
      currentSegIndex = 0;

      // Renderizar texto limpo no fundo
      const bgContainer = document.getElementById('background-text-content');
      bgContainer.innerHTML = `<h3 style="color:#fbbf24;margin-bottom:14px;">${cleanSpokenText(page.title)}</h3>` +
        segments.map(s => `<span class="segment-span" data-idx="${s.index}">${s.type === 'dialogue' ? `<strong>${s.speaker}:</strong> ` : ''}${s.text}</span><br><br>`).join('');

      rebuildCharacters(characters);

      if (segments.length) {
        updateSceneForSegment(segments[0]);
      }
      if (autoStart) {
        isPlaying = true;
        document.getElementById('btn-play-pause').textContent = '⏸ Pausar';
        playCurrentStep();
      }
    }

    // =========================================================
    // 7. LOOP DE ANIMAÇÃO 3D (CAMINHAR, ESBARRAR E BALÃO 3D)
    // =========================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      const seg = segments[currentSegIndex];
      const activeList = seg && seg.type === 'dialogue'
        ? seg.participants.map(n => avatarsMap[n]).filter(Boolean)
        : [];

      activeList.forEach((av, i) => {
        // Movimento suave de caminhada enquanto conversam
        const walkOffset = Math.sin(t * 1.6 + av.phase) * 0.75;
        av.mesh.position.x = av.baseX + walkOffset;
        av.mesh.position.z = 0.8 + Math.cos(t * 1.1 + av.phase) * 0.45;

        // Balanço das pernas ao andar
        av.leftLeg.rotation.x = Math.sin(t * 5) * 0.35;
        av.rightLeg.rotation.x = -Math.sin(t * 5) * 0.35;

        // Olhar na direção da conversa
        av.mesh.rotation.y = activeList.length > 1 ? (i === 0 ? 0.45 : -0.45) : Math.sin(t * 0.8) * 0.2;
      });

      // Simular leve esbarrão e recuo se dois avatares chegarem muito perto
      if (activeList.length === 2) {
        const dist = activeList[1].mesh.position.x - activeList[0].mesh.position.x;
        if (dist < 1.05) {
          activeList[0].mesh.position.x -= 0.15;
          activeList[1].mesh.position.x += 0.15;
        }
      }

      // Atualizar posição 2D do balão de fala acima da cabeça do falante
      const bubble = document.getElementById('active-speech-bubble');
      if (bubble && seg && seg.type === 'dialogue' && avatarsMap[seg.speaker]) {
        const speakerMesh = avatarsMap[seg.speaker].mesh;
        const headPos = new THREE.Vector3(speakerMesh.position.x, 2.95, speakerMesh.position.z);
        headPos.project(camera);

        const x = (headPos.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-(headPos.y * 0.5) + 0.5) * window.innerHeight;
        bubble.style.left = `${Math.max(140, Math.min(window.innerWidth - 140, x))}px`;
        bubble.style.top = `${Math.max(95, y)}px`;
        bubble.style.display = stageVisible ? 'block' : 'none';
      }

      renderer.render(scene, camera);
    }
    animate();

    // =========================================================
    // 8. EVENTOS DE INTERFACE E CONTROLES
    // =========================================================
    const dotsBtn = document.getElementById('dots-btn');
    const dropdown = document.getElementById('dropdown-menu');
    dotsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => dropdown.classList.remove('open'));

    // Play / Pause
    document.getElementById('btn-play-pause').addEventListener('click', () => {
      if (isPlaying) {
        isPlaying = false;
        window.speechSynthesis.cancel();
        document.getElementById('btn-play-pause').textContent = '▶ Continuar';
      } else {
        if (currentSegIndex >= segments.length - 1 && document.getElementById('percent-label').textContent === '100%') {
          currentSegIndex = 0;
        }
        isPlaying = true;
        document.getElementById('btn-play-pause').textContent = '⏸ Pausar';
        playCurrentStep();
      }
    });

    // Avançar / Voltar
    document.getElementById('btn-next').addEventListener('click', () => {
      window.speechSynthesis.cancel();
      if (currentSegIndex < segments.length - 1) {
        currentSegIndex++;
        playCurrentStep();
      } else if (currentPageIndex < pages.length - 1) {
        loadPage(currentPageIndex + 1, isPlaying);
      }
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      window.speechSynthesis.cancel();
      if (currentSegIndex > 0) {
        currentSegIndex--;
        playCurrentStep();
      } else if (currentPageIndex > 0) {
        loadPage(currentPageIndex - 1, isPlaying);
      }
    });

    // Barra de Progresso Arrastável ("Scrubbing" rápido)
    document.getElementById('progress-slider').addEventListener('input', (e) => {
      const pct = Number(e.target.value);
      const targetIdx = Math.min(segments.length - 1, Math.floor((pct / 100) * segments.length));
      if (targetIdx !== currentSegIndex) {
        currentSegIndex = targetIdx;
        window.speechSynthesis.cancel();
        playCurrentStep();
      }
    });

    // Alternar Imagens 3D / Só Texto
    document.getElementById('btn-toggle-stage').addEventListener('click', () => {
      stageVisible = !stageVisible;
      container.classList.toggle('hidden-stage', !stageVisible);
      document.getElementById('btn-toggle-stage').textContent = stageVisible
        ? '👁️ Limpar Imagens (Ver Só Texto)'
        : '🎬 Mostrar Palco 3D';
    });

    // Trocar Paisagem Manualmente
    document.getElementById('btn-cycle-bg').addEventListener('click', () => {
      const next = themesList[(themesList.indexOf(currentTheme) + 1) % themesList.length];
      applySceneTheme(next);
    });

    // Modal de Texto e Páginas
    const modal = document.getElementById('editor-modal');
    let editingPageIdx = 0;

    function renderModalPages() {
      const bar = document.getElementById('modal-pages-bar');
      bar.innerHTML = pages.map((p, idx) =>
        `<button class="page-chip ${idx === editingPageIdx ? 'active' : ''}" data-p="${idx}">Página ${idx + 1}</button>`
      ).join('') + `<button class="page-chip" id="modal-new-page">+ Nova Página</button>`;

      bar.querySelectorAll('[data-p]').forEach(btn => {
        btn.addEventListener('click', () => {
          pages[editingPageIdx].title = document.getElementById('page-title-input').value;
          pages[editingPageIdx].text = document.getElementById('page-text-input').value;
          editingPageIdx = Number(btn.dataset.p);
          openEditor(editingPageIdx);
        });
      });

      document.getElementById('modal-new-page').addEventListener('click', () => {
        pages.push({ title: `Página ${pages.length + 1}`, text: 'Narrador começa uma nova cena.\nMaria: Vamos continuar nossa jornada!' });
        editingPageIdx = pages.length - 1;
        openEditor(editingPageIdx);
      });
    }

    function openEditor(idx = currentPageIndex) {
      editingPageIdx = idx;
      renderModalPages();
      document.getElementById('page-title-input').value = pages[idx].title;
      document.getElementById('page-text-input').value = pages[idx].text;
      modal.classList.add('open');
    }

    document.getElementById('btn-open-editor').addEventListener('click', () => openEditor(currentPageIndex));
    document.getElementById('btn-add-page').addEventListener('click', () => {
      pages.push({ title: `Página ${pages.length + 1}`, text: 'Uma nova paisagem surge no horizonte.\nJoão: Estamos quase lá!' });
      openEditor(pages.length - 1);
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.remove('open'));
    document.getElementById('btn-save-story').addEventListener('click', () => {
      pages[editingPageIdx].title = document.getElementById('page-title-input').value || `Página ${editingPageIdx + 1}`;
      pages[editingPageIdx].text = document.getElementById('page-text-input').value;
      modal.classList.remove('open');
      window.speechSynthesis.cancel();
      isPlaying = false;
      document.getElementById('btn-play-pause').textContent = '▶ Iniciar';
      loadPage(editingPageIdx, false);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Inicializar primeira página
    loadPage(0, false);
  </script>
</body>
</html>
