<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>O Estrategista — Livro Interativo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #0b0e14;
    --panel-bg: #141923;
    --book-page: #f4ebd8;
    --book-ink: #29221c;
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.25);
    --text-light: #e2e8f0;
    --text-muted: #94a3b8;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at top, #182030 0%, var(--bg-dark) 100%);
    color: var(--text-light);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: none;
    touch-action: manipulation;
}

/* BARRA SUPERIOR COM BOTÃO DE FECHAR TUDO */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: rgba(12, 16, 24, 0.94);
    border-bottom: 1px solid var(--gold-soft);
    position: sticky;
    top: 0;
    z-index: 50;
}

.brand {
    display: flex;
    flex-direction: column;
}

.brand h1 {
    margin: 0;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--gold);
}

.brand span {
    font-size: 12px;
    color: var(--text-muted);
}

.close-all-btn {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid rgba(239, 68, 68, 0.5);
    color: #fecaca;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s ease;
}

.close-all-btn:hover {
    background: rgba(239, 68, 68, 0.35);
}

/* ABAS PRINCIPAIS */
.main-tabs {
    max-width: 1280px;
    margin: 20px auto 0;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 14px;
}

@media (max-width: 720px) {
    .main-tabs {
        grid-template-columns: 1fr;
    }
}

.tab-btn {
    padding: 15px 18px;
    border-radius: 12px;
    border: 2px solid var(--gold-soft);
    background: #151c29;
    color: var(--text-light);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.tab-btn.add-text-tab {
    background: linear-gradient(135deg, #b45309, #d4af37);
    color: #0f172a;
    border-color: #fde047;
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
}

.tab-btn.active {
    outline: 3px solid rgba(250, 204, 21, 0.55);
    transform: translateY(-1px);
}

/* CONTENTOR PRINCIPAL */
.container {
    width: 100%;
    max-width: 1280px;
    margin: 20px auto 0;
    padding: 0 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 24px;
}

/* ABA ADICIONAR TEXTO (GRANDE + ZOOM PRÓPRIO) */
.add-text-panel {
    display: none;
    background: var(--panel-bg);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
}

.add-text-panel.open {
    display: block;
}

.panel-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
}

.panel-top-row h2 {
    margin: 0;
    font-family: 'Cinzel', serif;
    font-size: 21px;
    color: var(--gold);
}

.zoom-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0d121b;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.zoom-toolbar button {
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: #222c40;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
}

.zoom-toolbar span {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    min-width: 48px;
    text-align: center;
}

.big-text-box {
    width: 100%;
    min-height: 380px;
    max-height: 70vh;
    padding: 20px;
    border-radius: 14px;
    border: 1px solid rgba(212, 175, 55, 0.35);
    background: #0c1018;
    color: #f8fafc;
    font-family: 'Lora', serif;
    font-size: 18px;
    line-height: 1.75;
    resize: vertical;
    outline: none;
    overscroll-behavior: contain;
    touch-action: pan-y;
}

.big-text-box:focus {
    border-color: var(--gold);
}

.text-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
}

/* ÁREA DA ANIMAÇÃO E LIVRO */
.stage-and-book-wrapper.hidden-all {
    display: none;
}

.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--panel-bg);
    padding: 14px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-muted);
}

.badge strong {
    color: var(--text-light);
}

#peopleCount {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    padding: 2px 10px;
    border-radius: 20px;
    font-weight: bold;
    border: 1px solid rgba(16, 185, 129, 0.3);
}

.main-stage {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 24px;
    align-items: stretch;
}

@media (max-width: 960px) {
    .main-stage {
        grid-template-columns: 1fr;
    }
}

.canvas-wrapper {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid var(--gold-soft);
    background: #0f1520;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
}

/* CONTROLOS COM BOTÃO PAUSAR CENTRALIZADO */
.controls-panel {
    background: #131822;
    padding: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.controls-row {
    display: grid;
    grid-template-columns: 1fr 1.35fr 1fr;
    gap: 10px;
    align-items: stretch;
}

@media (max-width: 640px) {
    .controls-row {
        grid-template-columns: 1fr;
    }
}

button.ctrl-btn {
    padding: 13px 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    background: #232d42;
    color: white;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
}

button.ctrl-btn:hover {
    background: #31405e;
}

button.pause-center {
    background: linear-gradient(135deg, #d97706, #f59e0b);
    color: #111827;
    border: 2px solid #fde68a;
    font-size: 14px;
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
}

button.primary-btn {
    background: linear-gradient(135deg, #059669, #10b981);
    border: none;
}

button.danger-btn {
    background: rgba(239, 68, 68, 0.2);
    border-color: rgba(239, 68, 68, 0.45);
    color: #fca5a5;
}

/* LIVRO DA HISTÓRIA */
.book-container {
    background: var(--book-page);
    color: var(--book-ink);
    border-radius: 16px;
    padding: 28px 30px;
    box-shadow:
        inset 12px 0 24px rgba(0, 0, 0, 0.12),
        0 15px 35px rgba(0, 0, 0, 0.5);
    border: 3px solid #5c4328;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.book-header {
    border-bottom: 2px solid rgba(92, 67, 40, 0.25);
    padding-bottom: 12px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.book-chapter {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    color: #7c5832;
    text-transform: uppercase;
}

.page-number {
    font-family: 'Lora', serif;
    font-size: 13px;
    color: #7c5832;
    font-style: italic;
}

#currentSpeaker {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 700;
    color: #8b261d;
    margin-bottom: 12px;
}

#currentText {
    font-family: 'Lora', serif;
    font-size: 18px;
    line-height: 1.75;
    color: #1f1914;
    min-height: 165px;
    margin-bottom: 24px;
}

.progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #6b533b;
    margin-bottom: 6px;
    font-weight: 600;
}

.progress-area {
    background: rgba(92, 67, 40, 0.2);
    height: 8px;
    border-radius: 10px;
    overflow: hidden;
}

#progress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #8b261d, #d4af37);
    transition: width 0.3s ease;
}

/* SECÇÃO INFERIOR PARA CONFIGURAÇÕES (AO BAIXAR A TELA) */
.settings-section {
    background: var(--panel-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 24px;
    margin-top: 8px;
}

.settings-section h3 {
    margin: 0 0 16px;
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--gold);
}

.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    align-items: center;
}

.setting-card {
    background: #0e131d;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06);
}

select, input[type="range"] {
    width: 100%;
    margin-top: 8px;
    accent-color: var(--gold);
}

select {
    background: #1c2434;
    color: var(--text-light);
    border: 1px solid var(--gold-soft);
    padding: 9px 12px;
    border-radius: 8px;
}
</style>
</head>

<body>

<!-- TOPO COM BOTÃO PARA FECHAR TUDO -->
<div class="top-bar">
    <div class="brand">
        <h1>O ESTRATEGISTA</h1>
        <span>Livro Animado & Avaliador de Histórias</span>
    </div>
    <button class="close-all-btn" onclick="closeEverything()">✕ FECHAR TUDO</button>
</div>

<!-- ABAS PRINCIPAIS -->
<div class="main-tabs">
    <button id="tabAddTextBtn" class="tab-btn add-text-tab active" onclick="openAddTextTab()">
        ✍️ ADICIONAR TEXTO (ABA PRINCIPAL)
    </button>
    <button id="tabStageBtn" class="tab-btn" onclick="openStageTab()">
        📖 VER ANIMAÇÃO & LIVRO
    </button>
</div>

<div class="container">

    <!-- ABA ADICIONAR TEXTO COM CAIXA GRANDE E ZOOM PRÓPRIO -->
    <section id="addTextPanel" class="add-text-panel open">
        <div class="panel-top-row">
            <h2>✍️ ADICIONAR TEXTO</h2>

            <div class="zoom-toolbar">
                <span>🔍 Zoom:</span>
                <button type="button" onclick="changeTextZoom(-10)">−</button>
                <span id="zoomValue">100%</span>
                <button type="button" onclick="changeTextZoom(10)">+</button>
                <button type="button" onclick="resetTextZoom()">100%</button>
            </div>
        </div>

        <textarea id="hugeStoryInput" class="big-text-box" placeholder="Escreve ou cola aqui o teu texto bem grande...&#10;&#10;Exemplo:&#10;Lorian: Temos 300 homens prontos na montanha.&#10;Mira: Dentro da casa encontramos o mapa secreto.&#10;Ronan: Na floresta restam 50 homens.&#10;Seran: A noite caiu sobre a ponte."></textarea>

        <div class="text-actions">
            <button type="button" class="ctrl-btn primary-btn" onclick="applyAndShowStory()">
                ✓ APLICAR TEXTO E ABRIR ANIMAÇÃO
            </button>
            <button type="button" class="ctrl-btn" onclick="fillSampleText()">
                ⚡ EXEMPLO RÁPIDO
            </button>
            <button type="button" class="ctrl-btn danger-btn" onclick="clearTextArea()">
                🗑 LIMPAR TEXTO
            </button>
        </div>
    </section>

    <!-- ANIMAÇÃO E LIVRO -->
    <div id="stageAndBookWrapper" class="stage-and-book-wrapper">

        <div class="status-bar">
            <div class="badge">
                <span>Trecho:</span>
                <strong id="sceneNumber">1</strong> — <strong id="sceneName">Campo de batalha</strong>
            </div>

            <div class="badge">
                <span>Pessoas na cena:</span>
                <span id="peopleCount">0</span>
            </div>
        </div>

        <div class="main-stage" style="margin-top: 16px;">
            <div class="canvas-wrapper">
                <canvas id="screen" width="960" height="540"></canvas>

                <div class="controls-panel">
                    <div class="controls-row">
                        <button type="button" class="ctrl-btn primary-btn" onclick="startStory()">▶ INICIAR</button>
                        <button type="button" class="ctrl-btn pause-center" onclick="pauseStory()">Ⅱ PAUSAR</button>
                        <button type="button" class="ctrl-btn" onclick="resumeStory()">▶ CONTINUAR</button>
                    </div>

                    <div class="controls-row">
                        <button type="button" class="ctrl-btn" onclick="prevSegment()">⏮ ANTERIOR</button>
                        <button type="button" class="ctrl-btn" onclick="skipNext()">⏭ PRÓXIMO</button>
                        <button type="button" class="ctrl-btn danger-btn" onclick="restartStory()">↻ REINICIAR</button>
                    </div>
                </div>
            </div>

            <div class="book-container">
                <div>
                    <div class="book-header">
                        <span class="book-chapter" id="bookChapterTitle">Trecho 1</span>
                        <span class="page-number" id="pageIndicator">Página 1 / 1</span>
                    </div>

                    <div id="currentSpeaker">📜 NARRADOR</div>

                    <div id="currentText">
                        Abre a aba <strong>ADICIONAR TEXTO</strong> para colar o teu texto grande ou carrega em <strong>INICIAR</strong>.
                    </div>
                </div>

                <div>
                    <div class="progress-label">
                        <span>Progresso</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-area">
                        <div id="progress"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- SECÇÃO DE CONFIGURAÇÕES AO BAIXAR A TELA -->
    <section id="settingsSection" class="settings-section">
        <h3>⚙️ CONFIGURAÇÕES</h3>
        <div class="settings-grid">
            <div class="setting-card">
                <label for="speedRange">⚡ Velocidade da leitura: <strong id="speedLabel" style="color: var(--gold);">1.1x</strong></label>
                <input type="range" id="speedRange" min="0.8" max="2.0" step="0.1" value="1.1" oninput="updateSpeed(this.value)">
            </div>

            <div class="setting-card">
                <label for="sceneSelect">🎬 Saltar para trecho:</label>
                <select id="sceneSelect" onchange="jumpToScene(this.value)"></select>
            </div>

            <div class="setting-card">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600;">
                    <input type="checkbox" id="voiceToggle" checked style="width: auto; margin: 0;">
                    🔊 Narração por Voz Ativa
                </label>
            </div>
        </div>
    </section>

</div>

<script>
/* =====================================================
   ABAS, ZOOM DO TEXTO E FECHAR TUDO
===================================================== */

let currentZoom = 100;

function changeTextZoom(delta) {
    currentZoom = Math.max(70, Math.min(180, currentZoom + delta));
    applyZoomStyle();
}

function resetTextZoom() {
    currentZoom = 100;
    applyZoomStyle();
}

function applyZoomStyle() {
    const box = document.getElementById("hugeStoryInput");
    box.style.fontSize = (18 * (currentZoom / 100)) + "px";
    document.getElementById("zoomValue").textContent = currentZoom + "%";
}

function openAddTextTab() {
    document.getElementById("stageAndBookWrapper").classList.remove("hidden-all");
    document.getElementById("addTextPanel").classList.add("open");
    document.getElementById("tabAddTextBtn").classList.add("active");
    document.getElementById("tabStageBtn").classList.remove("active");
}

function openStageTab() {
    document.getElementById("stageAndBookWrapper").classList.remove("hidden-all");
    document.getElementById("addTextPanel").classList.remove("open");
    document.getElementById("tabStageBtn").classList.add("active");
    document.getElementById("tabAddTextBtn").classList.remove("active");
}

function closeEverything() {
    running = false;
    paused = false;
    clearTimeout(speechTimer);
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();

    document.getElementById("stageAndBookWrapper").classList.add("hidden-all");
    document.getElementById("addTextPanel").classList.remove("open");
    document.getElementById("tabAddTextBtn").classList.remove("active");
    document.getElementById("tabStageBtn").classList.remove("active");
}

/* =====================================================
   CANVAS, AVATARES ÚNICOS E CENÁRIOS
===================================================== */

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let running = false;
let paused = false;
let currentIndex = 0;
let speechToken = 0;
let speechRate = 1.1;

let currentSegment = null;
let speechTimer = null;
let availableVoices = [];

function loadVoices() {
    if ("speechSynthesis" in window) {
        availableVoices = window.speechSynthesis.getVoices();
    }
}
loadVoices();
if ("speechSynthesis" in window && window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
}

const avatarPresets = [
    { color: "#e2e8f0", cape: "#991b1b", hair: "#1e1b18", style: "spiky", skin: "#eab693" },
    { color: "#f472b6", cape: "#831843", hair: "#5c2d16", style: "long", skin: "#f1c2a2" },
    { color: "#60a5fa", cape: "#1e3a8a", hair: "#3b2f2f", style: "hood", skin: "#d9a077" },
    { color: "#fbbf24", cape: "#78350f", hair: "#92400e", style: "beard", skin: "#e0ac84" },
    { color: "#34d399", cape: "#065f46", hair: "#111827", style: "band", skin: "#c6865c" },
    { color: "#c084fc", cape: "#4c1d95", hair: "#fde047", style: "crown", skin: "#f3c8a8" },
    { color: "#fb923c", cape: "#7c2d12", hair: "#27272a", style: "mohawk", skin: "#d4986e" },
    { color: "#38bdf8", cape: "#0c4a6e", hair: "#475569", style: "beard", skin: "#e5b590" }
];

const characters = {};

function createUniqueAvatar(name) {
    if (!name || name === "Narrador") return;
    if (!characters[name]) {
        const idx = Object.keys(characters).length;
        const preset = avatarPresets[idx % avatarPresets.length];
        characters[name] = {
            x: 480,
            y: 395,
            color: preset.color,
            cape: preset.cape,
            hair: preset.hair,
            style: preset.style,
            skin: preset.skin,
            visible: false,
            action: "idle",
            targetX: 480,
            phase: idx * 1.3
        };
    }
}

["Lorian", "Mira", "Ronan", "Seran", "Aldric", "Edric"].forEach(createUniqueAvatar);

let soldiers = [];
let stars = [];
let sceneBackground = "battle";
let sceneTitle = "Campo de batalha";
let sceneNumber = 1;

let clock = 0;
let speakingCharacter = null;
let speechBubble = "";

for (let i = 0; i < 45; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * 250,
        r: Math.random() * 1.8 + 0.5,
        twinkle: Math.random() * 5
    });
}

function createSoldiers(amount) {
    soldiers = [];
    const visualCount = Math.min(80, Math.max(0, amount));
    const cols = 16;
    for (let i = 0; i < visualCount; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        soldiers.push({
            x: 45 + col * 58 + (row % 2) * 14,
            y: 432 + row * 18,
            phase: Math.random() * 10,
            color: "#64748b"
        });
    }
}

function setScene(scene, title, people, soldierCount) {
    sceneBackground = scene;
    sceneTitle = title;
    sceneNumber = currentSegment ? currentSegment.sceneNumber : 1;

    Object.keys(characters).forEach(name => {
        characters[name].visible = false;
        characters[name].action = "idle";
    });

    const activeSpeakers = (people || []).filter(n => n && n !== "Narrador");
    const spacing = W / (activeSpeakers.length + 1);

    activeSpeakers.forEach((name, idx) => {
        createUniqueAvatar(name);
        const charObj = characters[name];
        const posX = Math.round(spacing * (idx + 1));
        charObj.visible = true;
        charObj.x = posX;
        charObj.targetX = posX;
    });

    createSoldiers(soldierCount || 0);

    document.getElementById("sceneNumber").textContent = sceneNumber;
    document.getElementById("sceneName").textContent = title;
    document.getElementById("bookChapterTitle").textContent = `Trecho ${sceneNumber} — ${title}`;
    document.getElementById("sceneSelect").value = getFirstIndexOfScene(sceneNumber);

    updatePeopleCount(soldierCount || 0);
}

function getFirstIndexOfScene(num) {
    const idx = story.findIndex(s => s.sceneNumber === num);
    return idx >= 0 ? idx : 0;
}

function updatePeopleCount(realSoldiersCount) {
    const visibleProtagonists = Object.values(characters).filter(c => c.visible).length;
    document.getElementById("peopleCount").textContent = visibleProtagonists + (realSoldiersCount || 0);
}

function rebuildSceneDropdown() {
    const select = document.getElementById("sceneSelect");
    select.innerHTML = "";
    const seen = new Set();

    story.forEach((seg, idx) => {
        if (!seen.has(seg.sceneNumber)) {
            seen.add(seg.sceneNumber);
            const opt = document.createElement("option");
            opt.value = idx;
            opt.textContent = `${seg.sceneNumber}. ${seg.title}`;
            select.appendChild(opt);
        }
    });
}

function drawBackground() {
    let skyTop = "#1e293b", skyBottom = "#334155";
    let groundTop = "#292f36", groundBottom = "#181c20";

    if (sceneBackground === "house") {
        skyTop = "#3b2314"; skyBottom = "#6b3e26";
        groundTop = "#4a2c18"; groundBottom = "#26150b";
    } else if (sceneBackground === "forest") {
        skyTop = "#0d2818"; skyBottom = "#1b4332";
        groundTop = "#1e3a24"; groundBottom = "#0c1a10";
    } else if (sceneBackground === "mountain") {
        skyTop = "#1e3a5f"; skyBottom = "#7dd3fc";
        groundTop = "#3f4e4f"; groundBottom = "#1c2425";
    } else if (sceneBackground === "castle") {
        skyTop = "#172554"; skyBottom = "#3b82f6";
        groundTop = "#3f3f46"; groundBottom = "#18181b";
    } else if (sceneBackground === "night") {
        skyTop = "#020617"; skyBottom = "#0f172a";
        groundTop = "#14221d"; groundBottom = "#09100e";
    } else if (sceneBackground === "tower") {
        skyTop = "#090d16"; skyBottom = "#1e1b4b";
        groundTop = "#27272a"; groundBottom = "#09090b";
    } else if (sceneBackground === "bridge") {
        skyTop = "#1e3a5f"; skyBottom = "#475569";
        groundTop = "#29323c"; groundBottom = "#14191f";
    } else if (sceneBackground === "map") {
        skyTop = "#271c19"; skyBottom = "#452c1e";
        groundTop = "#3a2618"; groundBottom = "#1f140c";
    }

    const skyGrad = ctx.createLinearGradient(0, 0, 0, 410);
    skyGrad.addColorStop(0, skyTop);
    skyGrad.addColorStop(1, skyBottom);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    if (sceneBackground === "night" || sceneBackground === "tower") {
        stars.forEach(st => {
            const alpha = 0.4 + Math.sin(clock * 2 + st.twinkle) * 0.4;
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.arc(800, 95, 32, 0, Math.PI * 2);
        ctx.fill();
    }

    if (sceneBackground === "mountain" || sceneBackground === "battle") {
        ctx.fillStyle = sceneBackground === "mountain" ? "#475569" : "rgba(15, 23, 42, 0.55)";
        ctx.beginPath();
        ctx.moveTo(0, 340);
        ctx.lineTo(170, 145);
        ctx.lineTo(340, 330);
        ctx.lineTo(540, 130);
        ctx.lineTo(740, 330);
        ctx.lineTo(890, 160);
        ctx.lineTo(960, 290);
        ctx.lineTo(960, 410);
        ctx.lineTo(0, 410);
        ctx.fill();
    }

    if (sceneBackground === "forest") {
        for (let tx = 50; tx < W; tx += 110) {
            ctx.fillStyle = "#3e2723";
            ctx.fillRect(tx - 10, 240, 20, 170);

            ctx.fillStyle = "#2d6a4f";
            ctx.beginPath();
            ctx.arc(tx, 225, 48, 0, Math.PI * 2);
            ctx.arc(tx - 24, 250, 36, 0, Math.PI * 2);
            ctx.arc(tx + 24, 250, 36, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    if (sceneBackground === "house") {
        ctx.fillStyle = "#5c3a21";
        ctx.fillRect(90, 120, 780, 290);

        ctx.fillStyle = "#fbbf24";
        ctx.fillRect(170, 175, 110, 95);
        ctx.strokeStyle = "#3b2314";
        ctx.lineWidth = 6;
        ctx.strokeRect(170, 175, 110, 95);

        ctx.fillStyle = "#292524";
        ctx.fillRect(680, 230, 120, 180);
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(740, 370, 28 + Math.sin(clock * 12) * 3, Math.PI, 0);
        ctx.fill();
    }

    if (sceneBackground === "castle") {
        ctx.fillStyle = "#475569";
        ctx.fillRect(650, 190, 180, 215);
        ctx.fillRect(630, 160, 45, 245);
        ctx.fillRect(805, 160, 45, 245);
    }

    if (sceneBackground === "tower") {
        ctx.fillStyle = "#334155";
        ctx.fillRect(380, 80, 190, 325);
        ctx.fillStyle = "#f59e0b";
        ctx.fillRect(455, 135, 40, 65);
    }

    if (sceneBackground === "bridge") {
        ctx.fillStyle = "#78350f";
        ctx.fillRect(0, 355, 960, 50);
    }

    if (sceneBackground === "map") {
        ctx.fillStyle = "#d6b88d";
        ctx.fillRect(310, 295, 340, 110);
        ctx.strokeStyle = "#78350f";
        ctx.lineWidth = 4;
        ctx.strokeRect(310, 295, 340, 110);
    }

    const groundGrad = ctx.createLinearGradient(0, 405, 0, H);
    groundGrad.addColorStop(0, groundTop);
    groundGrad.addColorStop(1, groundBottom);
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, 405, W, 135);
}

function drawCharacter(name, c) {
    if (!c.visible) return;

    const x = c.x;
    const y = c.y;
    const bounce = Math.sin(clock * 2 + c.phase) * 2;
    const headY = y - 105 + bounce;

    if (speakingCharacter === name) {
        ctx.fillStyle = "rgba(212, 175, 55, 0.24)";
        ctx.beginPath();
        ctx.ellipse(x, y + 2, 46, 12, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(x, y + 2, 28, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = c.cape;
    ctx.beginPath();
    ctx.moveTo(x - 14, y - 88 + bounce);
    ctx.lineTo(x - 24 - Math.sin(clock * 4 + c.phase) * 4, y - 10);
    ctx.lineTo(x + 24 + Math.sin(clock * 4 + c.phase) * 4, y - 10);
    ctx.lineTo(x + 14, y - 88 + bounce);
    ctx.fill();

    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 9;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(x - 7, y - 45);
    ctx.lineTo(x - 10, y);
    ctx.moveTo(x + 7, y - 45);
    ctx.lineTo(x + 10, y);
    ctx.stroke();

    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.roundRect(x - 16, y - 90 + bounce, 32, 48, 6);
    ctx.fill();

    let armAngle = Math.sin(clock * 3 + c.phase) * 0.08;
    if (c.action === "raise") armAngle = -1.2;
    if (c.action === "attack") armAngle = -1.4;

    ctx.strokeStyle = c.color;
    ctx.lineWidth = 8;

    ctx.beginPath();
    ctx.moveTo(x - 14, y - 80 + bounce);
    ctx.lineTo(x - 29, y - 56 + armAngle * 12);
    ctx.moveTo(x + 14, y - 80 + bounce);
    ctx.lineTo(x + 29, y - 56 - armAngle * 12);
    ctx.stroke();

    ctx.fillStyle = c.skin;
    ctx.beginPath();
    ctx.arc(x, headY, 19, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = c.hair;
    if (c.style === "long") {
        ctx.beginPath();
        ctx.arc(x, headY - 3, 20, Math.PI * 0.85, Math.PI * 2.15);
        ctx.fill();
        ctx.fillRect(x - 19, headY, 8, 26);
        ctx.fillRect(x + 11, headY, 8, 26);
    } else if (c.style === "crown") {
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.moveTo(x - 16, headY - 14);
        ctx.lineTo(x - 10, headY - 27);
        ctx.lineTo(x, headY - 18);
        ctx.lineTo(x + 10, headY - 27);
        ctx.lineTo(x + 16, headY - 14);
        ctx.fill();
    } else if (c.style === "hood") {
        ctx.strokeStyle = c.color;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(x, headY, 21, Math.PI, Math.PI * 2);
        ctx.stroke();
    } else if (c.style === "mohawk") {
        ctx.fillRect(x - 4, headY - 28, 8, 14);
    } else {
        ctx.beginPath();
        ctx.arc(x, headY - 5, 19, Math.PI, Math.PI * 2);
        ctx.fill();
    }

    if (c.style === "beard") {
        ctx.fillStyle = c.hair;
        ctx.beginPath();
        ctx.arc(x, headY + 6, 14, 0, Math.PI);
        ctx.fill();
    }

    ctx.fillStyle = "#111827";
    ctx.fillRect(x - 7, headY - 2, 3, 3);
    ctx.fillRect(x + 5, headY - 2, 3, 3);

    const labelWidth = Math.max(74, name.length * 9 + 20);
    ctx.fillStyle = speakingCharacter === name ? "#8b261d" : "rgba(15, 23, 42, 0.92)";
    ctx.beginPath();
    ctx.roundRect(x - labelWidth / 2, headY - 54, labelWidth, 25, 7);
    ctx.fill();

    ctx.strokeStyle = speakingCharacter === name ? "#facc15" : c.color;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 13px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(name, x, headY - 37);
}

function drawSoldiers() {
    soldiers.forEach(s => {
        const bounce = Math.sin(clock * 3 + s.phase) * 2;
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x - 6, s.y - 22 + bounce, 12, 20);

        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.arc(s.x, s.y - 28 + bounce, 6.5, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawSpeechBubble() {
    if (!speechBubble || !speakingCharacter) return;

    const c = characters[speakingCharacter];
    if (!c || !c.visible) return;

    const x = Math.max(195, Math.min(W - 195, c.x));
    const y = c.y - 182;

    const text = speechBubble.length > 56
        ? speechBubble.substring(0, 53) + "..."
        : speechBubble;

    ctx.font = "600 14px Lora, serif";
    const width = Math.min(360, ctx.measureText(text).width + 32);

    ctx.fillStyle = "#f4ebd8";
    ctx.beginPath();
    ctx.roundRect(x - width / 2, y - 28, width, 38, 10);
    ctx.fill();

    ctx.strokeStyle = "#8b261d";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#f4ebd8";
    ctx.beginPath();
    ctx.moveTo(c.x - 6, y + 10);
    ctx.lineTo(c.x + 6, y + 10);
    ctx.lineTo(c.x, y + 18);
    ctx.fill();

    ctx.fillStyle = "#1f1914";
    ctx.textAlign = "center";
    ctx.fillText(text, x, y - 4);
}

function render() {
    if (!paused) {
        clock += 0.016;
    }

    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawSoldiers();

    Object.keys(characters).forEach(name => {
        drawCharacter(name, characters[name]);
    });

    drawSpeechBubble();
    requestAnimationFrame(render);
}

render();

/* =====================================================
   AVALIADOR DE TEXTO
===================================================== */

const rotatingScenes = [
    { bg: "battle", title: "Campo de batalha" },
    { bg: "house", title: "Dentro da casa" },
    { bg: "forest", title: "Na floresta" },
    { bg: "mountain", title: "Na montanha" },
    { bg: "castle", title: "No castelo" },
    { bg: "night", title: "Sob a noite" },
    { bg: "tower", title: "Na torre" },
    { bg: "bridge", title: "Na ponte" },
    { bg: "map", title: "Mesa de estratégia" }
];

let story = [
    {
        sceneNumber: 1,
        scene: "battle",
        title: "Campo de batalha",
        people: ["Lorian"],
        soldiers: 50,
        speaker: "Lorian",
        text: "A batalha começou com 50 homens atentos ao horizonte.",
        action: { actor: "Lorian", type: "raise" }
    }
];

function detectSoldierCount(text, fallback) {
    const t = text.toLowerCase();
    const numMatch = t.match(/\b(\d{1,5})\s+(?:homens|soldados|guerreiros|arqueiros|cavaleiros)\b/);
    if (numMatch) return parseInt(numMatch[1], 10);
    if (t.includes("muitos homens") || t.includes("multidão")) return 80;
    if (t.includes("poucos homens") || t.includes("alguns homens")) return 8;
    return fallback;
}

function detectSceneForSegment(text, index) {
    const t = text.toLowerCase();
    if (t.includes("casa") || t.includes("quarto") || t.includes("sala")) return { bg: "house", title: "Dentro da casa" };
    if (t.includes("floresta") || t.includes("bosque") || t.includes("árvore")) return { bg: "forest", title: "Na floresta" };
    if (t.includes("montanha") || t.includes("serra") || t.includes("pico")) return { bg: "mountain", title: "Na montanha" };
    if (t.includes("ponte")) return { bg: "bridge", title: "Na ponte" };
    if (t.includes("torre")) return { bg: "tower", title: "Na torre" };
    if (t.includes("castelo") || t.includes("rei")) return { bg: "castle", title: "No castelo" };
    if (t.includes("noite") || t.includes("lua")) return { bg: "night", title: "Sob a noite" };
    if (t.includes("mapa") || t.includes("plano")) return { bg: "map", title: "Mesa de estratégia" };
    return rotatingScenes[index % rotatingScenes.length];
}

function parseLineToSegment(rawLine, index, lastSoldierCount) {
    const line = rawLine.trim();
    if (!line) return null;

    let speaker = "Narrador";
    let speechText = line;

    const match = line.match(/^([A-Za-zÀ-ÿ]{2,20})\s*(?::|—|-)\s*(.+)$/);
    if (match) {
        const candidate = match[1].trim();
        const formattedName = candidate.charAt(0).toUpperCase() + candidate.slice(1);
        if (formattedName.toLowerCase() !== "narrador") {
            speaker = formattedName;
            createUniqueAvatar(speaker);
        }
        speechText = match[2].trim();
    }

    const sceneInfo = detectSceneForSegment(speechText, index);
    const soldiersInSegment = detectSoldierCount(speechText, lastSoldierCount);
    const activePeople = speaker !== "Narrador" ? [speaker] : [];
    const actions = ["walk", "raise", "attack"];

    return {
        sceneNumber: index + 1,
        scene: sceneInfo.bg,
        title: sceneInfo.title,
        people: activePeople,
        soldiers: soldiersInSegment,
        speaker: speaker,
        text: speechText,
        action: speaker !== "Narrador" ? { actor: speaker, type: actions[index % actions.length] } : null,
        _soldierTracker: soldiersInSegment
    };
}

function applyAndShowStory() {
    const rawText = document.getElementById("hugeStoryInput").value.trim();
    if (!rawText) {
        alert("Escreve ou cola um texto primeiro!");
        return;
    }

    let chunks = rawText.split(/\r?\n+/).map(l => l.trim()).filter(Boolean);
    if (chunks.length === 1 && rawText.length > 220) {
        chunks = rawText.match(/[^.!?]+[.!?]+(?:\s|$)/g) || [rawText];
    }

    const parsedSegments = [];
    let currentSoldierTotal = 0;

    chunks.forEach((chunk, idx) => {
        const seg = parseLineToSegment(chunk, idx, currentSoldierTotal);
        if (seg) {
            currentSoldierTotal = seg._soldierTracker;
            parsedSegments.push(seg);
        }
    });

    if (parsedSegments.length === 0) return;

    story = parsedSegments;
    rebuildSceneDropdown();

    clearTimeout(speechTimer);
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();

    currentIndex = 0;
    currentSegment = story[0];
    running = true;
    paused = false;
    speechToken++;

    openStageTab();
    speakSegment(story[0], speechToken);
}

function fillSampleText() {
    document.getElementById("hugeStoryInput").value =
`Lorian: Reunimos 300 homens para a marcha.
Mira: Dentro da casa encontramos o diário antigo.
Ronan: Na floresta restam 50 homens em posição.
Seran: No alto da montanha o plano ganha forma.
Edric: Muitos homens chegaram ao castelo ao amanhecer.`;
}

function clearTextArea() {
    document.getElementById("hugeStoryInput").value = "";
}

/* =====================================================
   CONTROLO DA LEITURA E VOZ
===================================================== */

function updateSpeed(val) {
    speechRate = parseFloat(val);
    document.getElementById("speedLabel").textContent = speechRate.toFixed(1) + "x";
}

function updateStoryText(segment) {
    const icon = segment.speaker === "Narrador" ? "📜" : "🗣️";
    document.getElementById("currentSpeaker").textContent = `${icon} ${segment.speaker.toUpperCase()}`;
    document.getElementById("currentText").textContent = segment.text;
    document.getElementById("pageIndicator").textContent = `Página ${currentIndex + 1} / ${story.length}`;

    const pct = Math.round(((currentIndex + 1) / story.length) * 100);
    document.getElementById("progress").style.width = pct + "%";
    document.getElementById("progressPercent").textContent = pct + "%";
}

function configureVoice(utterance, speaker) {
    utterance.lang = "pt-PT";
    utterance.rate = speechRate;

    const ptVoices = availableVoices.filter(v => v.lang.includes("pt"));
    if (ptVoices.length > 0) {
        if (speaker === "Mira") {
            const fem = ptVoices.find(v => /maria|joana|francisca|female|luciana/i.test(v.name));
            if (fem) utterance.voice = fem;
        } else {
            const masc = ptVoices.find(v => /duarte|cristiano|daniel|male|ricardo/i.test(v.name));
            if (masc) utterance.voice = masc;
        }
    }

    if (speaker === "Narrador") utterance.pitch = 1.0;
    else if (speaker === "Mira") utterance.pitch = 1.25;
    else if (speaker === "Edric" || speaker === "Seran") utterance.pitch = 0.78;
    else if (speaker === "Lorian") utterance.pitch = 0.9;
    else utterance.pitch = 0.95;
}

function speakSegment(segment, token) {
    if (!running || paused || token !== speechToken) return;

    currentSegment = segment;
    setScene(segment.scene, segment.title, segment.people, segment.soldiers);

    speakingCharacter = segment.speaker !== "Narrador" ? segment.speaker : null;
    speechBubble = segment.speaker !== "Narrador" ? segment.text : "";

    if (segment.action && characters[segment.action.actor]) {
        characters[segment.action.actor].action = segment.action.type;
    }

    updateStoryText(segment);
    clearTimeout(speechTimer);

    const voiceEnabled = document.getElementById("voiceToggle").checked;

    if (voiceEnabled && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(segment.text);
        configureVoice(utterance, segment.speaker);

        utterance.onend = function() {
            if (token !== speechToken || paused || !running) return;
            nextSegment();
        };
        utterance.onerror = function() {
            if (token !== speechToken || paused || !running) return;
            nextSegment();
        };

        window.speechSynthesis.speak(utterance);
    } else {
        const duration = Math.max(1800, (segment.text.length * 48) / speechRate);
        speechTimer = setTimeout(() => {
            if (token !== speechToken || paused || !running) return;
            nextSegment();
        }, duration);
    }
}

function startStory() {
    openStageTab();
    if (running && !paused) return;
    if (currentIndex >= story.length) {
        restartStory();
        return;
    }
    running = true;
    paused = false;
    speechToken++;
    speakSegment(story[currentIndex], speechToken);
}

function nextSegment() {
    if (!running || paused) return;
    currentIndex++;
    if (currentIndex >= story.length) {
        finishStory();
        return;
    }
    speakSegment(story[currentIndex], speechToken);
}

function skipNext() {
    clearTimeout(speechTimer);
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    if (currentIndex + 1 >= story.length) {
        finishStory();
        return;
    }
    currentIndex++;
    running = true;
    paused = false;
    speechToken++;
    speakSegment(story[currentIndex], speechToken);
}

function prevSegment() {
    clearTimeout(speechTimer);
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    currentIndex = Math.max(0, currentIndex - 1);
    running = true;
    paused = false;
    speechToken++;
    speakSegment(story[currentIndex], speechToken);
}

function jumpToScene(indexStr) {
    openStageTab();
    clearTimeout(speechTimer);
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    currentIndex = parseInt(indexStr, 10) || 0;
    running = true;
    paused = false;
    speechToken++;
    speakSegment(story[currentIndex], speechToken);
}

function pauseStory() {
    if (!running) return;
    paused = true;
    if ("speechSynthesis" in window) window.speechSynthesis.pause();
    clearTimeout(speechTimer);
}

function resumeStory() {
    if (!running || !paused) return;
    paused = false;
    if ("speechSynthesis" in window && window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
    } else {
        speechToken++;
        speakSegment(story[currentIndex], speechToken);
    }
}

function restartStory() {
    running = false;
    paused = false;
    currentIndex = 0;
    speechToken++;
    clearTimeout(speechTimer);
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();

    speakingCharacter = null;
    speechBubble = "";
    currentSegment = story[0];

    document.getElementById("currentSpeaker").textContent = "📜 NARRADOR";
    document.getElementById("currentText").textContent = "Pronto para começar. Carrega em INICIAR.";
    document.getElementById("pageIndicator").textContent = `Página 1 / ${story.length}`;
    document.getElementById("progress").style.width = "0%";
    document.getElementById("progressPercent").textContent = "0%";

    setScene(story[0].scene, story[0].title, story[0].people, story[0].soldiers);
}

function finishStory() {
    running = false;
    paused = false;
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    speakingCharacter = null;
    speechBubble = "";
    document.getElementById("currentSpeaker").textContent = "📖 FIM";
    document.getElementById("currentText").textContent = "A história terminou.";
    document.getElementById("progress").style.width = "100%";
    document.getElementById("progressPercent").textContent = "100%";
}

/* =====================================================
   INICIALIZAÇÃO
===================================================== */
rebuildSceneDropdown();
currentSegment = story[0];
setScene(story[0].scene, story[0].title, story[0].people, story[0].soldiers);
document.getElementById("pageIndicator").textContent = `Página 1 / ${story.length}`;
</script>
