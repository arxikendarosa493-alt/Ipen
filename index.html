let worldState = {
  entities: [],
  bridgeBroken: false
};

// Popular seletor de capítulos sem duplicados
const addedChapters = new Set();
storyBeats.forEach((b, idx) => {
  if (!addedChapters.has(b.chapter)) {
    addedChapters.add(b.chapter);
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = b.chapter;
    sceneSelect.appendChild(opt);
  }
});

function spawn(profileKey, x, y, dir, action, targetX) {
  return {
    profileKey,
    customName: null,
    x,
    y,
    dir,
    action,
    targetX,
    walkCycle: Math.random() * 10
  };
}

function loadBeat(index) {
  currentBeatIndex = index;
  const beat = storyBeats[index];

  // Atualizar dropdown para o capítulo atual
  for (let i = 0; i < sceneSelect.options.length; i++) {
    if (sceneSelect.options[i].textContent === beat.chapter) {
      sceneSelect.selectedIndex = i;
      break;
    }
  }

  sceneBadge.textContent = beat.chapter;
  shotBadge.textContent = beat.shot === "dialogue" ? "CLOSE-UP: DIÁLOGO" : "PLANO GERAL: AÇÃO";
  speakerLabel.textContent = beat.speaker;
  subtitleText.textContent = beat.text;
  progressBar.style.width = `${((index + 1) / storyBeats.length) * 100}%`;
  beatStartTime = performance.now();
  beat.setup(worldState);

  if (isPlaying && !isPaused) {
    speakText(beat.text, () => {
      if (isPlaying && !isPaused) {
        if (currentBeatIndex < storyBeats.length - 1) {
          setTimeout(() => loadBeat(currentBeatIndex + 1), 650);
        } else {
          isPlaying = false;
          isSpeaking = false;
          sceneBadge.textContent = "FIM DO EPISÓDIO 10";
          document.getElementById('btn-play').textContent = "↻ Repetir História";
        }
      }
    });
  }
}

function speakText(text, onEndCallback) {
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-PT';
  utterance.rate = speechRate;
  utterance.pitch = 0.95;

  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v => v.lang.includes('pt'));
  if (ptVoice) utterance.voice = ptVoice;

  utterance.onstart = () => { isSpeaking = true; };
  utterance.onend = () => {
    isSpeaking = false;
    if (onEndCallback) onEndCallback();
  };
  utterance.onerror = () => { isSpeaking = false; };
  window.speechSynthesis.speak(utterance);
}

function startStory() {
  isPlaying = true;
  isPaused = false;
  document.getElementById('btn-pause').textContent = "⏸ Pausar";
  document.getElementById('btn-play').textContent = "▶ A Reproduzir...";
  loadBeat(currentBeatIndex >= storyBeats.length - 1 ? 0 : currentBeatIndex);
}

function togglePause() {
  if (!isPlaying) return;
  if (!isPaused) {
    isPaused = true;
    isSpeaking = false;
    window.speechSynthesis.pause();
    document.getElementById('btn-pause').textContent = "▶ Retomar";
  } else {
    isPaused = false;
    isSpeaking = true;
    window.speechSynthesis.resume();
    document.getElementById('btn-pause').textContent = "⏸ Pausar";
  }
}

function nextScene() {
  if (currentBeatIndex < storyBeats.length - 1) {
    loadBeat(currentBeatIndex + 1);
  }
}

function prevScene() {
  if (currentBeatIndex > 0) {
    loadBeat(currentBeatIndex - 1);
  }
}

function jumpToScene(val) {
  loadBeat(parseInt(val));
}

function updateSpeed(val) {
  speechRate = parseFloat(val);
  if (isPlaying && !isPaused) {
    loadBeat(currentBeatIndex);
  }
}

// =========================================================================

function drawTree(x, y, scale = 1, dark = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = dark ? "#27272a" : "#18181b";
  ctx.strokeStyle = dark ? "#3f3f46" : "#09090b";
  ctx.lineWidth = 3;

  // Tronco texturizado
  ctx.beginPath();
  ctx.moveTo(-6, 0);
  ctx.lineTo(-3, -85);
  ctx.lineTo(3, -85);
  ctx.lineTo(6, 0);
  ctx.closePath();
  ctx.fill();

  // Galhos
  ctx.beginPath();
  ctx.moveTo(0, -55);
  ctx.lineTo(-26, -80);
  ctx.moveTo(0, -65);
  ctx.lineTo(28, -88);
  ctx.stroke();

  // Copa em camadas
  ctx.beginPath();
  ctx.arc(0, -105, 38, 0, Math.PI * 2);
  ctx.arc(-28, -88, 26, 0, Math.PI * 2);
  ctx.arc(28, -88, 26, 0, Math.PI * 2);
  ctx.fill();

  // Luz na copa
  ctx.fillStyle = dark ? "#3f3f46" : "#3f3f46";
  ctx.beginPath();
  ctx.arc(-10, -112, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMountain(x, y, w, h) {
  ctx.fillStyle = "#d4d4d8";
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y);
  ctx.lineTo(x, y - h);
  ctx.lineTo(x + w / 2, y);
  ctx.closePath();
  ctx.fill();

  // Face sombreada da montanha
  ctx.fillStyle = "#a1a1aa";
  ctx.beginPath();
  ctx.moveTo(x, y - h);
  ctx.lineTo(x + w / 2, y);
  ctx.lineTo(x + w * 0.08, y);
  ctx.closePath();
  ctx.fill();

  // Contorno
  ctx.strokeStyle = "#52525b";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y);
  ctx.lineTo(x, y - h);
  ctx.lineTo(x + w / 2, y);
  ctx.stroke();
}

function drawEnvironment(env, isCloseUp) {
  const isNight = env === "night_battle" || env === "tower_interior";

  // Gradiente de Céu / Fundo
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  if (isNight) {
    grad.addColorStop(0, "#09090b");
    grad.addColorStop(1, "#27272a");
  } else {
    grad.addColorStop(0, "#e4e4e7");
    grad.addColorStop(1, "#fafafa");
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (env === "hills") {
    drawMountain(220, 440, 420, 210);
    drawMountain(800, 440, 460, 190);
    if (!isCloseUp) {
      drawTree(70, 440, 0.9);
      drawTree(520, 440, 0.65);
      // Soldados escondidos na colina
      ctx.fillStyle = "#3f3f46";
      for (let i = 0; i < 7; i++) {
        ctx.fillRect(750 + i * 24, 345 + (i % 2) * 8, 7, 14);
      }
    }
  } else if (env === "war_tent" || env === "imperial_tent") {
    // Interior da tenda com pilares e estandartes
    ctx.strokeStyle = "#27272a";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(40, 440);
    ctx.lineTo(512, 70);
    ctx.lineTo(984, 440);
    ctx.stroke();

    // Estandarte no fundo
    ctx.fillStyle = env === "imperial_tent" ? "#18181b" : "#52525b";
    ctx.fillRect(482, 110, 60, 110);
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(488, 116, 48, 98);

    if (!isCloseUp) {
      // Mesa tática detalhada
      ctx.fillStyle = "#18181b";
      ctx.fillRect(360, 390, 260, 14);
      ctx.fillRect(385, 404, 14, 36);
      ctx.fillRect(580, 404, 14, 36);
      // Mapa aberto e pedras de posição
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(410, 383, 160, 7);
      ctx.fillStyle = "#09090b";
      ctx.fillRect(440, 378, 8, 5);
      ctx.fillRect(495, 378, 8, 5);
    }
  } else if (env === "camp_rock") {
    drawMountain(760, 440, 500, 220);
    drawTree(80, 440, 1.05);
    drawTree(930, 440, 0.95);
    if (!isCloseUp) {
      // Rocha esculpida
      ctx.fillStyle = "#27272a";
      ctx.beginPath();
      ctx.moveTo(130, 440);
      ctx.lineTo(165, 385);
      ctx.lineTo(255, 385);
      ctx.lineTo(295, 440);
      ctx.closePath();
      ctx.fill();
    }
  } else if (env === "forest_march") {
    drawMountain(820, 440, 480, 250);
    for (let i = 0; i < 8; i++) {
      drawTree(50 + i * 135, 440, 0.8 + (i % 3) * 0.2);
    }
  } else if (env === "bridge") {
    drawMountain(200, 440, 380, 190);
    if (!isCloseUp) {
      drawTree(55, 440, 0.9);
      ctx.fillStyle = "#18181b";
      ctx.fillRect(0, 440, 460, 136);
      ctx.fillRect(820, 440, 204, 136);

      ctx.fillStyle = "#52525b";
      if (!worldState.bridgeBroken) {
        ctx.fillRect(460, 415, 360, 25);
        ctx.fillStyle = "#e4e4e7";
        ctx.beginPath();
        ctx.arc(550, 440, 40, Math.PI, 0);
        ctx.arc(730, 440, 40, Math.PI, 0);
        ctx.fill();
      } else {
        ctx.save();
        ctx.translate(460, 415);
        ctx.rotate(0.38);
        ctx.fillRect(0, 0, 165, 22);
        ctx.restore();

        ctx.save();
        ctx.translate(820, 415);
        ctx.rotate(-0.42);
        ctx.fillRect(-165, 0, 165, 22);
        ctx.restore();
      }
      return;
    }
  } else if (env === "night_battle") {
    ctx.fillStyle = "#fafafa";
    ctx.beginPath();
    ctx.arc(850, 110, 42, 0, Math.PI * 2);
    ctx.fill();
    // Chuva de flechas luminosas
    ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const ax = ((frameCount * 7 + i * 105) % 820) + 100;
      const ay = 160 + Math.sin(ax * 0.01) * 55 + (i * 18);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax + 26, ay + 7);
      ctx.stroke();
    }
  } else if (env === "tower_interior") {
    ctx.strokeStyle = "#3f3f46";
    ctx.lineWidth = 4;
    ctx.strokeRect(452, 110, 120, 180);
    ctx.beginPath();
    ctx.moveTo(512, 110);
    ctx.lineTo(512, 290);
    ctx.moveTo(452, 200);
    ctx.lineTo(572, 200);
    ctx.stroke();

    if (!isCloseUp) {
      ctx.fillStyle = "#27272a";
      ctx.fillRect(460, 390, 104, 10);
      ctx.fillRect(475, 400, 10, 40);
      ctx.fillRect(540, 400, 10, 40);
      // Brilho da lamparina
      const glow = ctx.createRadialGradient(512, 370, 5, 512, 370, 80);
      glow.addColorStop(0, "rgba(255,255,255,0.6)");
      glow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(512, 370, 80, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(506, 372, 12, 18);
    }
  }

  // Solo com relevo
  if (!isCloseUp) {
    ctx.fillStyle = isNight ? "#09090b" : "#18181b";
    ctx.fillRect(0, 440, canvas.width, 136);
    ctx.strokeStyle = isNight ? "#3f3f46" : "#52525b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 440);
    ctx.lineTo(canvas.width, 440);
    ctx.stroke();
  }
}

// =========================================================================
// DESENHO DE CORPO ESTRUTURADO E ANATÓMICO (PLANO GERAL)
// =========================================================================

function drawStructuredCharacter(ent, isNight) {
  const p = CHAR_PROFILES[ent.profileKey];
  const ink = isNight ? "#f4f4f5" : "#18181b";
  const fillBody = p.whiteArmor ? "#ffffff" : (isNight ? "#27272a" : "#27272a");
  const fillSkin = p.whiteArmor ? "#ffffff" : (isNight ? "#e4e4e7" : "#f4f4f5");

  // Movimento suave
  if (Math.abs(ent.x - ent.targetX) > 2) {
    const speed = ent.action === "flee" ? 3.5 : (ent.action === "march" ? 1.9 : 1.4);
    ent.x += ent.x < ent.targetX ? speed : -speed;
    ent.walkCycle += 0.18;
  } else if (ent.action === "walk" || ent.action === "march") {
    ent.action = "idle";
  }

  const isMoving = Math.abs(ent.x - ent.targetX) > 2;
  const legSwing = isMoving ? Math.sin(ent.walkCycle) * 14 : 0;
  const fightAngle = ent.action === "fight" ? Math.sin(frameCount * 0.28 + ent.x) * 0.8 : 0;
  const dir = ent.dir === "right" ? 1 : -1;

  ctx.save();
  ctx.translate(ent.x, ent.y);

  // Sombra no chão
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // 1. Capa esvoaçante (atrás do corpo)
  if (p.cape) {
    ctx.fillStyle = p.whiteArmor ? "#e4e4e7" : "#09090b";
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-4 * dir, -62);
    ctx.quadraticCurveTo(
      -24 * dir,
      -35 + Math.sin(frameCount * 0.12 + ent.x) * 4,
      -28 * dir - legSwing * 0.4,
      -8
    );
    ctx.lineTo(-6 * dir, -12);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // 2. Pernas estruturadas (coxas, joelhos e botas)
  ctx.strokeStyle = ink;
  ctx.lineWidth = 5.5;
  ctx.lineCap = "round";

  // Perna traseira
  ctx.beginPath();
  ctx.moveTo(0, -32);
  ctx.lineTo(-legSwing * 0.6, -16);
  ctx.lineTo(-legSwing, -2);
  ctx.stroke();

  // Perna dianteira
  ctx.beginPath();
  ctx.moveTo(0, -32);
  ctx.lineTo(legSwing * 0.6, -16);
  ctx.lineTo(legSwing, -2);
  ctx.stroke();

  // 3. Tronco / Peitoral com ombros largos
  ctx.fillStyle = fillBody;
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-11, -64); // Ombro esquerdo
  ctx.lineTo(11, -64);  // Ombro direito
  ctx.lineTo(8, -32);   // Cintura direita
  ctx.lineTo(-8, -32);  // Cintura esquerda
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Detalhe de armadura no peito
  if (p.armor === "heavy" || p.armor === "white" || p.armor === "imperial") {
    ctx.beginPath();
    ctx.moveTo(-9, -54);
    ctx.lineTo(0, -48);
    ctx.lineTo(9, -54);
    ctx.stroke();
  }

  // 4. Cabeça e Detalhes (Elmo, Capuz, Coroa, Cabelo)
  ctx.fillStyle = fillSkin;
  ctx.beginPath();
  ctx.arc(0, -76, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  if (p.hair === "helmet" || p.hair === "helmet_open") {
    // Elmo metálico
    ctx.fillStyle = "#52525b";
    ctx.beginPath();
    ctx.arc(0, -77, 11, Math.PI, 0);
    ctx.lineTo(11, -72);
    ctx.lineTo(-11, -72);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else if (p.hood) {
    // Capuz de batedora (Mira)
    ctx.fillStyle = "#3f3f46";
    ctx.beginPath();
    ctx.arc(-2 * dir, -76, 11.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else {
    // Cabelo
    ctx.fillStyle = p.hair === "gray_short" || p.hair === "long_gray" ? "#a1a1aa" : "#09090b";
    ctx.beginPath();
    ctx.arc(0, -78, 10.5, Math.PI * 0.9, Math.PI * 2.1);
    ctx.fill();
  }

  if (p.crown) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(-8, -86);
    ctx.lineTo(-5, -94);
    ctx.lineTo(0, -88);
    ctx.lineTo(5, -94);
    ctx.lineTo(8, -86);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // Olho direcional
  ctx.fillStyle = "#09090b";
  ctx.fillRect(3 * dir, -78, 2.5, 2.5);

  // 5. Braço e Arma
  ctx.save();
  ctx.translate(2 * dir, -60);
  if (ent.action === "fight") {
    ctx.rotate(fightAngle * dir);
  } else if (ent.action === "point" || ent.action === "speech") {
    ctx.rotate(-0.9 * dir);
  } else if (ent.action === "celebrate") {
    ctx.rotate(-2.4 * dir);
  } else {
    ctx.rotate((legSwing * 0.03) * dir);
  }

  // Braço
  ctx.strokeStyle = ink;
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(14 * dir, 16);
  ctx.stroke();

  // Arma na mão
  if (p.weapon === "sword" || p.weapon === "broad_sword") {
    ctx.strokeStyle = isNight ? "#ffffff" : "#3f3f46";
    ctx.lineWidth = p.weapon === "broad_sword" ? 3.5 : 2.5;
    ctx.beginPath();
    ctx.moveTo(14 * dir, 16);
    ctx.lineTo(38 * dir, 6);
    ctx.stroke();
  } else if (p.weapon === "spear") {
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-10 * dir, 22);
    ctx.lineTo(44 * dir, 4);
    ctx.stroke();
  } else if (p.weapon === "bow") {
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(14 * dir, 14, 16, -Math.PI / 2, Math.PI / 2, dir < 0);
    ctx.stroke();
  }
  ctx.restore();

  // Nome da personagem
  const label = ent.customName !== null ? ent.customName : p.name;
  if (label) {
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = ink;
    ctx.fillText(label, 0, -100);
  }

  ctx.restore();
}

// =========================================================================
// PLANO DE DIÁLOGO: CLOSE-UP NO ROSTO COM BOCA ANIMADA E TRAÇOS ÚNICOS
// =========================================================================

function drawPortraitBust(profileKey, x, y, facing, isTalking, isNight) {
  const p = CHAR_PROFILES[profileKey];
  const dir = facing === "right" ? 1 : -1;
  const mouthOpen = isTalking ? Math.abs(Math.sin(frameCount * 0.38)) * 11 + 2 : 0;

  ctx.save();
  ctx.translate(x, y);

  // Sombra dramática de fundo do busto
  ctx.fillStyle = isNight ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.06)";
  ctx.beginPath();
  ctx.arc(0, -40, 145, 0, Math.PI * 2);
  ctx.fill();

  // Ombros e Armadura (Busto largo)
  ctx.fillStyle = p.whiteArmor ? "#f4f4f5" : "#18181b";
  ctx.strokeStyle = isNight ? "#e4e4e7" : "#09090b";
  ctx.lineWidth = 3.5;

  ctx.beginPath();
  ctx.moveTo(-135, 160);
  ctx.quadraticCurveTo(-125, 45, -45, 35);
  ctx.lineTo(45, 35);
  ctx.quadraticCurveTo(125, 45, 135, 160);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Detalhes da armadura / gola
  ctx.strokeStyle = p.whiteArmor ? "#52525b" : "#71717a";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-55, 40);
  ctx.lineTo(0, 95);
  ctx.lineTo(55, 40);
  ctx.stroke();

  // Pescoço
  ctx.fillStyle = "#e4e4e7";
  ctx.strokeStyle = "#09090b";
  ctx.lineWidth = 3;
  ctx.fillRect(-24, 5, 48, 42);
  ctx.strokeRect(-24, 5, 48, 42);

  // Rosto (Mandíbula esculpida)
  ctx.fillStyle = "#fafafa";
  ctx.beginPath();
  ctx.moveTo(-54, -95);
  ctx.lineTo(54, -95);
  ctx.lineTo(50, -15);
  ctx.quadraticCurveTo(0, 32 + mouthOpen * 0.35, 0, 32 + mouthOpen * 0.35);
  ctx.quadraticCurveTo(-50, -15, -54, -95);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Barba (Ronan, Seran, Aldric, Edric)
  if (p.beard) {
    ctx.fillStyle = (p.hair === "gray_short" || p.hair === "long_gray") ? "#a1a1aa" : "#27272a";
    ctx.beginPath();
    ctx.moveTo(-51, -30);
    ctx.lineTo(-42, 8);
    ctx.quadraticCurveTo(0, 34 + mouthOpen * 0.35, 42, 8);
    ctx.lineTo(51, -30);
    ctx.lineTo(35, -18);
    ctx.lineTo(0, -14);
    ctx.lineTo(-35, -18);
    ctx.closePath();
    ctx.fill();
  }

  // Cicatriz (Ronan, Seran, Aldric)
  if (p.scar) {
    ctx.strokeStyle = "#71717a";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(18 * dir, -62);
    ctx.lineTo(30 * dir, -34);
    ctx.stroke();
  }

  // Olhos e Sobrancelhas Expressivas
  const eyeOffsetX = 12 * dir;
  // Sobrancelhas
  ctx.strokeStyle = "#09090b";
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(-30 + eyeOffsetX, -58);
  ctx.lineTo(-8 + eyeOffsetX, -53);
  ctx.moveTo(8 + eyeOffsetX, -53);
  ctx.lineTo(30 + eyeOffsetX, -58);
  ctx.stroke();

  // Olhos
  ctx.fillStyle = "#09090b";
  ctx.beginPath();
  ctx.ellipse(-19 + eyeOffsetX, -44, 6, 4, 0, 0, Math.PI * 2);
  ctx.ellipse(19 + eyeOffsetX, -44, 6, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Brilho nos olhos
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(-20 + eyeOffsetX, -46, 2.5, 2.5);
  ctx.fillRect(18 + eyeOffsetX, -46, 2.5, 2.5);

  // Nariz
  ctx.strokeStyle = "#27272a";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(eyeOffsetX, -46);
  ctx.lineTo(eyeOffsetX + 6 * dir, -22);
  ctx.lineTo(eyeOffsetX - 3 * dir, -20);
  ctx.stroke();

  // BOCA ANIMADA (mexe conforme a fala)
  const mouthY = -3;
  ctx.fillStyle = "#09090b";
  ctx.strokeStyle = "#09090b";
  ctx.lineWidth = 3;
  if (mouthOpen > 1.5) {
    ctx.beginPath();
    ctx.ellipse(eyeOffsetX, mouthY + mouthOpen * 0.25, 16, mouthOpen * 0.65, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(-16 + eyeOffsetX, mouthY);
    ctx.lineTo(16 + eyeOffsetX, mouthY);
    ctx.stroke();
  }

  // Cabelo / Capuz / Elmo / Coroa
  if (p.hood) {
    ctx.fillStyle = "#27272a";
    ctx.strokeStyle = "#09090b";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-68, 35);
    ctx.quadraticCurveTo(-75, -125, 0, -130);
    ctx.quadraticCurveTo(75, -125, 68, 35);
    ctx.lineTo(52, 35);
    ctx.quadraticCurveTo(58, -95, 0, -98);
    ctx.quadraticCurveTo(-58, -95, -52, 35);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else if (p.hair === "helmet") {
    ctx.fillStyle = "#3f3f46";
    ctx.beginPath();
    ctx.arc(0, -82, 62, Math.PI, 0);
    ctx.lineTo(62, -55);
    ctx.lineTo(-62, -55);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.fillStyle = (p.hair === "gray_short" || p.hair === "long_gray") ? "#a1a1aa" : "#09090b";
    ctx.beginPath();
    ctx.moveTo(-58, -60);
    ctx.quadraticCurveTo(-62, -125, 0, -125);
    ctx.quadraticCurveTo(62, -125, 58, -60);
    ctx.lineTo(48, -82);
    ctx.lineTo(0, -92);
    ctx.lineTo(-48, -82);
    ctx.closePath();
    ctx.fill();

    if (p.hair === "long_gray") {
      ctx.fillRect(-62, -65, 14, 95);
      ctx.fillRect(48, -65, 14, 95);
    }
  }

  if (p.crown) {
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#09090b";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-45, -112);
    ctx.lineTo(-30, -148);
    ctx.lineTo(-10, -122);
    ctx.lineTo(0, -155);
    ctx.lineTo(10, -122);
    ctx.lineTo(30, -148);
    ctx.lineTo(45, -112);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // Placa de identificação da personagem
  ctx.fillStyle = isNight ? "#f4f4f5" : "#09090b";
  ctx.fillRect(-90, 125, 180, 32);
  ctx.fillStyle = isNight ? "#09090b" : "#ffffff";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(p.name.toUpperCase(), 0, 146);

  ctx.restore();
}

// =========================================================================
// LOOP PRINCIPAL DE RENDERIZAÇÃO
// =========================================================================

function animate() {
  frameCount++;
  const beat = storyBeats[currentBeatIndex];
  const elapsed = (performance.now() - beatStartTime) / 1000;
  const isNight = beat.env === "night_battle" || beat.env === "tower_interior";

  if (!isPaused) {
    beat.update(worldState, elapsed);
  }

  if (beat.shot === "dialogue") {
    drawEnvironment(beat.env, true);

    // Vinheta cinematográfica
    ctx.fillStyle = isNight ? "rgba(0,0,0,0.45)" : "rgba(255,255,255,0.35)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const talkLeft = isSpeaking && (beat.activeSpeaker === "left" || beat.activeSpeaker === "both");
    const talkRight = isSpeaking && (beat.activeSpeaker === "right" || beat.activeSpeaker === "both");

    if (beat.leftChar) {
      drawPortraitBust(beat.leftChar, 280, 415, "right", talkLeft, isNight);
    }
    if (beat.rightChar) {
      drawPortraitBust(beat.rightChar, 744, 415, "left", talkRight, isNight);
    }
  } else {
    drawEnvironment(beat.env, false);
    worldState.entities.forEach(ent => drawStructuredCharacter(ent, isNight));
  }

  // Barras pretas de cinema (Letterbox)
  ctx.fillStyle = "#09090b";
  ctx.fillRect(0, 0, canvas.width, 32);
  ctx.fillRect(0, canvas.height - 32, canvas.width, 32);

  requestAnimationFrame(animate);
}

// Iniciar no primeiro quadro
loadBeat(0);
animate();
</script>
