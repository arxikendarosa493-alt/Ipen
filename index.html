<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Assistente IA</title>
  <style>
    :root {
      --bg-black: #000000;
      --surface-dark: #1E1F20;
      --surface-pill: #28292B;
      --user-bubble: #060A54;
      --accent-blue: #2538F5;
      --text-primary: #F2F2F2;
      --text-secondary: #9AA0A6;
      --border-subtle: #2C2D30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-primary);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP BAR */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      background: linear-gradient(to bottom, rgba(0,0,0,0.92) 70%, rgba(0,0,0,0));
    }

    .icon-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--surface-dark);
      border: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .right-pill {
      height: 42px;
      border-radius: 21px;
      background-color: var(--surface-dark);
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 4px;
    }

    .pill-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .pill-btn:active, .icon-circle:active {
      background-color: #333538;
    }

    /* CHAT AREA */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 74px 16px 96px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .chat-container::-webkit-scrollbar {
      width: 0px;
    }

    /* USER MESSAGE */
    .msg-user-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
      align-self: flex-end;
    }

    .msg-user-media {
      max-width: 240px;
      border-radius: 16px;
      object-fit: cover;
      display: block;
    }

    .msg-user-bubble {
      background-color: var(--user-bubble);
      color: #FFFFFF;
      padding: 12px 18px;
      border-radius: 22px;
      font-size: 16px;
      line-height: 1.42;
      word-wrap: break-word;
    }

    /* AI MESSAGE */
    .msg-ai-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      max-width: 95%;
      align-self: flex-start;
    }

    /* ESTADO "A ESBOÇAR A IDEIA" + CONTAGEM % (IGUAL À FOTO) */
    .sketch-stage {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .sketch-label {
      font-size: 16px;
      color: var(--text-primary);
      font-weight: 400;
    }

    .sketch-box {
      position: relative;
      width: 290px;
      height: 360px;
      border-radius: 18px;
      background-color: #020308;
      background-image: radial-gradient(rgba(95, 115, 220, 0.32) 1.3px, transparent 1.3px);
      background-size: 16px 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sketch-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(37, 56, 245, 0.14), rgba(0, 0, 0, 0.72) 85%);
      pointer-events: none;
    }

    .sketch-percent-pill {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 2;
      background-color: rgba(34, 36, 40, 0.9);
      color: #E8EAED;
      font-size: 15px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* MÍDIA FINAL (IMAGEM OU VÍDEO) */
    .msg-ai-media-box {
      position: relative;
      width: 100%;
      max-width: 310px;
      border-radius: 18px;
      overflow: hidden;
      background-color: #161718;
      animation: revealFade 0.35s ease;
    }

    @keyframes revealFade {
      from { opacity: 0.2; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    .msg-ai-media-box img,
    .msg-ai-media-box video {
      width: 100%;
      height: auto;
      max-height: 440px;
      object-fit: cover;
      display: block;
      border-radius: 18px;
    }

    .img-share-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .msg-ai-text {
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .msg-ai-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 2px;
      color: #B0B5BA;
    }

    .action-icon-btn {
      background: transparent;
      border: none;
      color: #B0B5BA;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
    }

    .action-icon-btn:active {
      color: #FFFFFF;
    }

    /* INPUT BAR */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 12px 14px 12px;
      background-color: var(--bg-black);
      z-index: 20;
    }

    .pending-img-preview {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--surface-dark);
      padding: 8px 12px;
      border-radius: 14px;
      margin-bottom: 8px;
      width: fit-content;
    }

    .pending-img-preview img,
    .pending-img-preview video {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .remove-pending-btn {
      background: #3A3B3E;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      cursor: pointer;
    }

    .input-pill {
      background-color: var(--surface-dark);
      border-radius: 28px;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 12px;
      gap: 8px;
    }

    .plus-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #D0D3D6;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 16px;
      min-width: 0;
    }

    .chat-input::placeholder {
      color: var(--text-secondary);
    }

    .mic-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #D0D3D6;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-wave-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--accent-blue);
      border: none;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* MODAL / MENU DOS TRÊS PONTINHOS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      background-color: #161718;
      width: 100%;
      max-width: 540px;
      height: 88dvh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
    }

    .modal-header h2 {
      font-size: 17px;
      font-weight: 600;
    }

    .close-modal-btn {
      background: var(--surface-pill);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .tabs-bar {
      display: flex;
      background: #101112;
      padding: 6px;
      gap: 6px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--surface-pill);
      color: #FFFFFF;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .tab-panel.active {
      display: flex;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 13px;
      color: #B0B5BA;
    }

    .field-input, .field-textarea {
      background: #222326;
      border: 1px solid #333539;
      border-radius: 12px;
      padding: 11px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .field-textarea {
      min-height: 75px;
      resize: vertical;
    }

    .primary-btn {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary-btn {
      background: #28292B;
      color: #fff;
      border: 1px solid #3A3B3E;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .qa-card {
      background: #1E1F21;
      border: 1px solid #2D2E32;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .qa-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .qa-q {
      font-weight: 600;
      font-size: 14px;
      color: #8AB4F8;
    }

    .qa-a {
      font-size: 13px;
      color: #D8DADC;
      white-space: pre-line;
    }

    .qa-thumb {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      margin-top: 4px;
    }

    .qa-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .mini-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      cursor: pointer;
      background: #2C2E32;
      color: #fff;
    }

    .mini-btn.danger {
      background: #4A1C1C;
      color: #FF8A8A;
    }

    .badge-count {
      background: var(--user-bubble);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
    }

    .toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: #28292B;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      border: 1px solid #3C3E42;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="top-bar">
    <button class="icon-circle" id="btnLeftMenu" title="Histórico / Perguntas Salvas">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="4" y1="9" x2="20" y2="9"></line>
        <line x1="4" y1="15" x2="14" y2="15"></line>
      </svg>
    </button>

    <div class="right-pill">
      <button class="pill-btn" id="btnNewChat" title="Nova conversa">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>
      <button class="pill-btn" id="btnThreeDots" title="Menu e Configurações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.8"></circle>
          <circle cx="12" cy="12" r="1.8"></circle>
          <circle cx="12" cy="19" r="1.8"></circle>
        </svg>
      </button>
    </div>
  </header>

  <!-- ÁREA DE MENSAGENS -->
  <main class="chat-container" id="chatContainer"></main>

  <!-- BARRA INFERIOR -->
  <footer class="bottom-bar">
    <div class="pending-img-preview" id="pendingImgPreview">
      <div id="pendingMediaThumbWrap"></div>
      <span style="font-size:12px; color:#ccc;">Mídia anexada</span>
      <button class="remove-pending-btn" id="btnRemovePendingImg">✕</button>
    </div>

    <div class="input-pill">
      <button class="plus-btn" id="btnAttachUserImg" title="Adicionar imagem ou vídeo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <input type="file" id="userImgInput" accept="image/*,video/*" hidden />

      <input type="text" class="chat-input" id="chatInput" placeholder="Responder ao ChatG..." autocomplete="off" />

      <button class="mic-btn" id="btnMic" title="Voz">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <button class="send-wave-btn" id="btnSend" title="Enviar">
        <svg id="iconWave" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="6" y1="10" x2="6" y2="14"></line>
          <line x1="10" y1="7" x2="10" y2="17"></line>
          <line x1="14" y1="5" x2="14" y2="19"></line>
          <line x1="18" y1="9" x2="18" y2="15"></line>
        </svg>
        <svg id="iconSendArrow" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </footer>

  <!-- MODAL DOS TRÊS PONTINHOS -->
  <div class="modal-overlay" id="menuModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>Menu do Assistente <span class="badge-count" id="qaTotalBadge">0</span></h2>
        <button class="close-modal-btn" id="btnCloseModal">✕</button>
      </div>

      <div class="tabs-bar">
        <button class="tab-btn active" data-tab="tab-qa">Perguntas & Respostas</button>
        <button class="tab-btn" data-tab="tab-img">Adicionar Mídia</button>
        <button class="tab-btn" data-tab="tab-cfg">Configurações</button>
      </div>

      <div class="modal-body">
        <!-- ABA 1: PERGUNTAS E RESPOSTAS -->
        <div class="tab-panel active" id="tab-qa">
          <div class="field-group">
            <label>Pergunta que você vai fazer (aceita palavras quase idênticas):</label>
            <input type="text" class="field-input" id="newQuestionInput" placeholder="Ex: Cria aí uma imagem de uma pessoa saltando" />
          </div>

          <div class="field-group">
            <label>Resposta que o assistente vai dar (opcional se enviar só mídia):</label>
            <textarea class="field-textarea" id="newAnswerInput" placeholder="Ex: Aqui está a tua criação!"></textarea>
          </div>

          <div class="field-group">
            <label>Imagem OU Vídeo na resposta (aparece após a contagem de %):</label>
            <input type="file" id="qaResponseMediaInput" accept="image/*,video/*" class="field-input" />
            <div id="qaResponseMediaPreview"></div>
          </div>

          <button class="primary-btn" id="btnSaveQA">Salvar Pergunta e Resposta</button>

          <hr style="border:0; border-top:1px solid #2C2D30; margin:4px 0;">

          <div class="field-group">
            <label>Escolher / Testar Perguntas Salvas (<span id="qaCountText">0</span>):</label>
            <input type="text" class="field-input" id="searchQaInput" placeholder="Pesquisar nas perguntas salvas..." />
          </div>

          <div id="qaListContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <!-- ABA 2: ADICIONAR IMAGEM OU VÍDEO -->
        <div class="tab-panel" id="tab-img">
          <p style="font-size:14px; color:#B0B5BA; line-height:1.4;">
            Envie uma imagem ou vídeo direto no chat. Se a pergunta corresponder a uma resposta com mídia, o assistente fará a contagem antes de mostrar.
          </p>

          <div class="field-group">
            <label>1. Escolher Imagem ou Vídeo:</label>
            <input type="file" id="directChatMediaInput" accept="image/*,video/*" class="field-input" />
          </div>

          <div class="field-group">
            <label>Legenda / Pergunta opcional:</label>
            <input type="text" class="field-input" id="directChatMediaCaption" placeholder="Ex: Cria aí uma imagem..." />
          </div>

          <button class="primary-btn" id="btnSendDirectMedia">Enviar no Chat</button>
        </div>

        <!-- ABA 3: CONFIGURAÇÕES -->
        <div class="tab-panel" id="tab-cfg">
          <div class="field-group">
            <label>Texto da contagem antes da imagem/vídeo:</label>
            <input type="text" class="field-input" id="cfgSketchLabelInput" value="A esboçar a ideia" />
          </div>

          <div class="field-group">
            <label>Duração da contagem (segundos):</label>
            <input type="number" class="field-input" id="cfgSketchDurationInput" min="1" max="15" value="3" />
          </div>

          <div class="field-group">
            <label>Texto da caixa de mensagem:</label>
            <input type="text" class="field-input" id="cfgPlaceholderInput" value="Responder ao ChatG..." />
          </div>

          <div class="field-group">
            <label>Tolerância para palavras quase idênticas (Similaridade mínima %):</label>
            <input type="number" class="field-input" id="cfgSimilarityInput" min="40" max="100" value="65" />
          </div>

          <div class="field-group">
            <label>Resposta padrão quando não encontrar nenhuma parecida:</label>
            <textarea class="field-textarea" id="cfgFallbackInput">Entendi! Guardei a tua mensagem. Podes abrir os três pontinhos no canto superior direito para cadastrar uma resposta personalizada para essa pergunta.</textarea>
          </div>

          <button class="primary-btn" id="btnSaveSettings">Salvar Configurações</button>

          <div style="display:flex; gap:8px; margin-top:6px;">
            <button class="secondary-btn" style="flex:1;" id="btnExportData">Exportar Backup</button>
            <button class="secondary-btn" style="flex:1;" id="btnImportTrigger">Importar Backup</button>
            <input type="file" id="importFileInput" accept=".json" hidden />
          </div>

          <button class="secondary-btn" style="color:#FF8A8A; border-color:#4A1C1C;" id="btnClearChat">Limpar Mensagens da Tela</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ==========================================
    // DADOS INICIAIS
    // ==========================================
    const DEFAULT_QA = [
      {
        id: 1,
        question: "Ola",
        answer: "Olá! 😊👋 Como estás?\n\nEstou aqui para te ajudar. O que vamos fazer hoje?",
        media: "",
        mediaType: ""
      },
      {
        id: 2,
        question: "Cria aí uma imagem de uma pessoa saltando e em alegria",
        answer: "",
        media: "",
        mediaType: ""
      }
    ];

    const STORAGE_KEY_QA = "assistente_ia_qa_v2";
    const STORAGE_KEY_CHAT = "assistente_ia_chat_v2";
    const STORAGE_KEY_CFG = "assistente_ia_cfg_v2";

    let qaDatabase = JSON.parse(localStorage.getItem(STORAGE_KEY_QA)) || DEFAULT_QA;
    let chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY_CHAT)) || [];
    let appConfig = JSON.parse(localStorage.getItem(STORAGE_KEY_CFG)) || {
      sketchLabel: "A esboçar a ideia",
      sketchDuration: 3,
      placeholder: "Responder ao ChatG...",
      similarityThreshold: 65,
      fallback: "Entendi! Guardei a tua mensagem. Podes abrir os três pontinhos no canto superior direito para cadastrar uma resposta personalizada para essa pergunta."
    };

    let pendingUserMedia = "";
    let pendingUserMediaType = "";

    let pendingQaMedia = "";
    let pendingQaMediaType = "";

    // ==========================================
    // ELEMENTOS DOM
    // ==========================================
    const chatContainer = document.getElementById("chatContainer");
    const chatInput = document.getElementById("chatInput");
    const btnSend = document.getElementById("btnSend");
    const iconWave = document.getElementById("iconWave");
    const iconSendArrow = document.getElementById("iconSendArrow");

    const menuModal = document.getElementById("menuModal");
    const btnThreeDots = document.getElementById("btnThreeDots");
    const btnLeftMenu = document.getElementById("btnLeftMenu");
    const btnCloseModal = document.getElementById("btnCloseModal");
    const btnNewChat = document.getElementById("btnNewChat");

    const userImgInput = document.getElementById("userImgInput");
    const btnAttachUserImg = document.getElementById("btnAttachUserImg");
    const pendingImgPreview = document.getElementById("pendingImgPreview");
    const pendingMediaThumbWrap = document.getElementById("pendingMediaThumbWrap");
    const btnRemovePendingImg = document.getElementById("btnRemovePendingImg");

    // ==========================================
    // SIMILARIDADE (PALAVRAS QUASE IDÊNTICAS)
    // ==========================================
    function normalizeText(str) {
      return (str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\w\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function levenshteinDistance(a, b) {
      const matrix = Array.from({ length: a.length + 1 }, () => []);
      for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
      for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }
      return matrix[a.length][b.length];
    }

    function calculateSimilarity(str1, str2) {
      const s1 = normalizeText(str1);
      const s2 = normalizeText(str2);
      if (!s1 || !s2) return 0;
      if (s1 === s2) return 100;

      const maxLen = Math.max(s1.length, s2.length);
      const dist = levenshteinDistance(s1, s2);
      const charScore = ((maxLen - dist) / maxLen) * 100;

      const words1 = s1.split(" ");
      const words2 = s2.split(" ");
      let matchedWords = 0;

      words1.forEach(w1 => {
        const hasMatch = words2.some(w2 => {
          if (w1 === w2) return true;
          const wMax = Math.max(w1.length, w2.length);
          if (wMax <= 2) return false;
          const wDist = levenshteinDistance(w1, w2);
          return ((wMax - wDist) / wMax) >= 0.72;
        });
        if (hasMatch) matchedWords++;
      });

      const wordScore = (matchedWords / Math.max(words1.length, words2.length)) * 100;
      return Math.max(charScore, wordScore);
    }

    function findBestAnswer(userText) {
      let bestMatch = null;
      let highestScore = 0;

      for (const item of qaDatabase) {
        const score = calculateSimilarity(userText, item.question);
        if (score > highestScore) {
          highestScore = score;
          bestMatch = item;
        }
      }

      if (bestMatch && highestScore >= Number(appConfig.similarityThreshold || 65)) {
        return {
          text: bestMatch.answer,
          media: bestMatch.media || "",
          mediaType: bestMatch.mediaType || ""
        };
      }

      return {
        text: appConfig.fallback,
        media: "",
        mediaType: ""
      };
    }

    // ==========================================
    // UTILITÁRIOS DE MÍDIA E UI
    // ==========================================
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2300);
    }

    function saveChat() {
      try {
        localStorage.setItem(STORAGE_KEY_CHAT, JSON.stringify(chatHistory));
      } catch (e) {
        showToast("Aviso: mídia muito grande para salvar no histórico local.");
      }
    }

    function createMediaElement(src, type, className = "") {
      if (type === "video") {
        const vid = document.createElement("video");
        vid.src = src;
        vid.controls = true;
        vid.autoplay = true;
        vid.loop = true;
        vid.playsInline = true;
        if (className) vid.className = className;
        return vid;
      } else {
        const img = document.createElement("img");
        img.src = src;
        if (className) img.className = className;
        return img;
      }
    }

    function createActionBar(text) {
      const actions = document.createElement("div");
      actions.className = "msg-ai-actions";
      actions.innerHTML = `
        <button class="action-icon-btn" title="Copiar" onclick="copyText(${JSON.stringify(text || '')})">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <button class="action-icon-btn" title="Gostei" onclick="showToast('Feedback registado')">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
        </button>
        <button class="action-icon-btn" title="Não gostei" onclick="showToast('Feedback registado')">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"></path></svg>
        </button>
        <button class="action-icon-btn" title="Ouvir" onclick="speakText(${JSON.stringify(text || '')})">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </button>
        <button class="action-icon-btn" title="Partilhar" onclick="showToast('Pronto para partilhar')">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
        <button class="action-icon-btn" title="Opções" onclick="openMenuModal()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
        </button>
      `;
      return actions;
    }

    function appendAiMessageElements(msg) {
      const wrapper = document.createElement("div");
      wrapper.className = "msg-ai-wrapper";

      if (msg.media) {
        const mediaBox = document.createElement("div");
        mediaBox.className = "msg-ai-media-box";
        mediaBox.appendChild(createMediaElement(msg.media, msg.mediaType));

        const shareBadge = document.createElement("button");
        shareBadge.className = "img-share-badge";
        shareBadge.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>`;
        shareBadge.onclick = () => showToast("Mídia pronta para partilhar!");
        mediaBox.appendChild(shareBadge);

        wrapper.appendChild(mediaBox);
      }

      if (msg.text) {
        const textEl = document.createElement("div");
        textEl.className = "msg-ai-text";
        textEl.textContent = msg.text;
        wrapper.appendChild(textEl);
      }

      wrapper.appendChild(createActionBar(msg.text || ""));
      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function renderChat() {
      chatContainer.innerHTML = "";

      chatHistory.forEach((msg) => {
        if (msg.sender === "user") {
          const wrapper = document.createElement("div");
          wrapper.className = "msg-user-wrapper";

          if (msg.media) {
            wrapper.appendChild(createMediaElement(msg.media, msg.mediaType, "msg-user-media"));
          }

          if (msg.text) {
            const bubble = document.createElement("div");
            bubble.className = "msg-user-bubble";
            bubble.textContent = msg.text;
            wrapper.appendChild(bubble);
          }

          chatContainer.appendChild(wrapper);
        } else {
          appendAiMessageElements(msg);
        }
      });

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Contagem animada antes de exibir imagem ou vídeo
    function playSketchCountdownThenReveal(reply) {
      const stageWrapper = document.createElement("div");
      stageWrapper.className = "msg-ai-wrapper";

      const stage = document.createElement("div");
      stage.className = "sketch-stage";

      const label = document.createElement("div");
      label.className = "sketch-label";
      label.textContent = appConfig.sketchLabel || "A esboçar a ideia";

      const box = document.createElement("div");
      box.className = "sketch-box";

      const percentPill = document.createElement("div");
      percentPill.className = "sketch-percent-pill";
      percentPill.textContent = "1%";

      box.appendChild(percentPill);
      stage.appendChild(label);
      stage.appendChild(box);
      stageWrapper.appendChild(stage);
      chatContainer.appendChild(stageWrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      const durationMs = Math.max(1, Number(appConfig.sketchDuration || 3)) * 1000;
      const startTime = Date.now();

      const timer = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(100, Math.max(1, Math.round((elapsed / durationMs) * 100)));
        percentPill.textContent = progress + "%";

        if (progress >= 100) {
          clearInterval(timer);
          stageWrapper.remove();

          const aiMsg = {
            sender: "ai",
            text: reply.text,
            media: reply.media,
            mediaType: reply.mediaType
          };
          chatHistory.push(aiMsg);
          appendAiMessageElements(aiMsg);
          saveChat();
        }
      }, 60);
    }

    window.copyText = function(txt) {
      if (!txt) return;
      navigator.clipboard?.writeText(txt);
      showToast("Copiado!");
    };

    window.speakText = function(txt) {
      if (!txt || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(txt);
      utter.lang = "pt-PT";
      window.speechSynthesis.speak(utter);
    };

    // ==========================================
    // ENVIO DE MENSAGEM
    // ==========================================
    function sendMessage(customText = null, customMedia = null, customMediaType = null) {
      const text = customText !== null ? customText.trim() : chatInput.value.trim();
      const media = customMedia !== null ? customMedia : pendingUserMedia;
      const mediaType = customMediaType !== null ? customMediaType : pendingUserMediaType;

      if (!text && !media) return;

      chatHistory.push({
        sender: "user",
        text: text,
        media: media,
        mediaType: mediaType
      });

      chatInput.value = "";
      pendingUserMedia = "";
      pendingUserMediaType = "";
      pendingImgPreview.style.display = "none";
      pendingMediaThumbWrap.innerHTML = "";
      updateSendIcon();
      renderChat();
      saveChat();

      const reply = findBestAnswer(text || "midia");

      // Se a resposta tiver imagem ou vídeo, faz a contagem antes de aparecer
      if (reply.media) {
        playSketchCountdownThenReveal(reply);
      } else {
        setTimeout(() => {
          const aiMsg = {
            sender: "ai",
            text: reply.text,
            media: "",
            mediaType: ""
          };
          chatHistory.push(aiMsg);
          appendAiMessageElements(aiMsg);
          saveChat();
        }, 400);
      }
    }

    function updateSendIcon() {
      const hasContent = chatInput.value.trim().length > 0 || pendingUserMedia.length > 0;
      iconWave.style.display = hasContent ? "none" : "block";
      iconSendArrow.style.display = hasContent ? "block" : "none";
    }

    chatInput.addEventListener("input", updateSendIcon);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
    btnSend.addEventListener("click", () => sendMessage());

    // Anexo rápido no botão '+' (imagem ou vídeo)
    btnAttachUserImg.addEventListener("click", () => userImgInput.click());
    userImgInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const isVid = file.type.startsWith("video/");
      const reader = new FileReader();
      reader.onload = () => {
        pendingUserMedia = reader.result;
        pendingUserMediaType = isVid ? "video" : "image";
        pendingMediaThumbWrap.innerHTML = "";
        pendingMediaThumbWrap.appendChild(createMediaElement(pendingUserMedia, pendingUserMediaType, "qa-thumb"));
        pendingImgPreview.style.display = "flex";
        updateSendIcon();
      };
      reader.readAsDataURL(file);
    });

    btnRemovePendingImg.addEventListener("click", () => {
      pendingUserMedia = "";
      pendingUserMediaType = "";
      userImgInput.value = "";
      pendingMediaThumbWrap.innerHTML = "";
      pendingImgPreview.style.display = "none";
      updateSendIcon();
    });

    // ==========================================
    // MENU DOS TRÊS PONTINHOS E CRUD
    // ==========================================
    function openMenuModal() {
      menuModal.classList.add("open");
      renderQaList();
    }

    btnThreeDots.addEventListener("click", openMenuModal);
    btnLeftMenu.addEventListener("click", openMenuModal);
    btnCloseModal.addEventListener("click", () => menuModal.classList.remove("open"));

    btnNewChat.addEventListener("click", () => {
      chatHistory = [];
      saveChat();
      renderChat();
      showToast("Nova conversa iniciada");
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    // Prévia da mídia na resposta do assistente
    const qaResponseMediaInput = document.getElementById("qaResponseMediaInput");
    const qaResponseMediaPreview = document.getElementById("qaResponseMediaPreview");

    qaResponseMediaInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const isVid = file.type.startsWith("video/");
      const reader = new FileReader();
      reader.onload = () => {
        pendingQaMedia = reader.result;
        pendingQaMediaType = isVid ? "video" : "image";
        qaResponseMediaPreview.innerHTML = "";
        const el = createMediaElement(pendingQaMedia, pendingQaMediaType, "qa-thumb");
        qaResponseMediaPreview.appendChild(el);
      };
      reader.readAsDataURL(file);
    });

    // Salvar pergunta/resposta
    document.getElementById("btnSaveQA").addEventListener("click", () => {
      const q = document.getElementById("newQuestionInput").value.trim();
      const a = document.getElementById("newAnswerInput").value.trim();

      if (!q || (!a && !pendingQaMedia)) {
        showToast("Preencha a pergunta e a resposta ou mídia!");
        return;
      }

      qaDatabase.unshift({
        id: Date.now(),
        question: q,
        answer: a,
        media: pendingQaMedia,
        mediaType: pendingQaMediaType
      });

      try {
        localStorage.setItem(STORAGE_KEY_QA, JSON.stringify(qaDatabase));
        document.getElementById("newQuestionInput").value = "";
        document.getElementById("newAnswerInput").value = "";
        qaResponseMediaInput.value = "";
        pendingQaMedia = "";
        pendingQaMediaType = "";
        qaResponseMediaPreview.innerHTML = "";
        renderQaList();
        showToast("Salvo com sucesso!");
      } catch (e) {
        showToast("Arquivo grande demais para o armazenamento local.");
      }
    });

    function renderQaList(filter = "") {
      const container = document.getElementById("qaListContainer");
      const badge = document.getElementById("qaTotalBadge");
      const countText = document.getElementById("qaCountText");

      badge.textContent = qaDatabase.length;
      countText.textContent = qaDatabase.length;
      container.innerHTML = "";

      const normFilter = normalizeText(filter);
      const filtered = qaDatabase.filter(item =>
        !normFilter ||
        normalizeText(item.question).includes(normFilter) ||
        normalizeText(item.answer).includes(normFilter)
      );

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "qa-card";

        const typeLabel = item.media ? (item.mediaType === "video" ? " [Vídeo]" : " [Imagem]") : "";

        card.innerHTML = `
          <div class="qa-card-top">
            <div class="qa-q">P: ${item.question}${typeLabel}</div>
          </div>
          <div class="qa-a">R: ${item.answer || (item.media ? "(Mídia com contagem %)" : "")}</div>
          <div class="qa-thumb-slot"></div>
          <div class="qa-card-actions">
            <button class="mini-btn" onclick="askFromMenu(${item.id})">▶ Fazer essa pergunta agora</button>
            <button class="mini-btn danger" onclick="deleteQa(${item.id})">Excluir</button>
          </div>
        `;

        if (item.media) {
          card.querySelector(".qa-thumb-slot").appendChild(
            createMediaElement(item.media, item.mediaType, "qa-thumb")
          );
        }

        container.appendChild(card);
      });
    }

    document.getElementById("searchQaInput").addEventListener("input", (e) => {
      renderQaList(e.target.value);
    });

    window.askFromMenu = function(id) {
      const found = qaDatabase.find(i => i.id === id);
      if (!found) return;
      menuModal.classList.remove("open");
      sendMessage(found.question, "", "");
    };

    window.deleteQa = function(id) {
      qaDatabase = qaDatabase.filter(i => i.id !== id);
      localStorage.setItem(STORAGE_KEY_QA, JSON.stringify(qaDatabase));
      renderQaList(document.getElementById("searchQaInput").value);
      showToast("Removido!");
    };

    // Aba Adicionar Mídia direto no chat
    document.getElementById("btnSendDirectMedia").addEventListener("click", () => {
      const fileInput = document.getElementById("directChatMediaInput");
      const caption = document.getElementById("directChatMediaCaption").value.trim();
      const file = fileInput.files[0];

      if (!file) {
        showToast("Selecione uma imagem ou vídeo!");
        return;
      }

      const isVid = file.type.startsWith("video/");
      const reader = new FileReader();
      reader.onload = () => {
        menuModal.classList.remove("open");
        sendMessage(caption, reader.result, isVid ? "video" : "image");
        fileInput.value = "";
        document.getElementById("directChatMediaCaption").value = "";
      };
      reader.readAsDataURL(file);
    });

    // Configurações
    document.getElementById("cfgSketchLabelInput").value = appConfig.sketchLabel;
    document.getElementById("cfgSketchDurationInput").value = appConfig.sketchDuration;
    document.getElementById("cfgPlaceholderInput").value = appConfig.placeholder;
    document.getElementById("cfgSimilarityInput").value = appConfig.similarityThreshold;
    document.getElementById("cfgFallbackInput").value = appConfig.fallback;
    chatInput.placeholder = appConfig.placeholder;

    document.getElementById("btnSaveSettings").addEventListener("click", () => {
      appConfig.sketchLabel = document.getElementById("cfgSketchLabelInput").value || "A esboçar a ideia";
      appConfig.sketchDuration = Number(document.getElementById("cfgSketchDurationInput").value) || 3;
      appConfig.placeholder = document.getElementById("cfgPlaceholderInput").value || "Responder ao ChatG...";
      appConfig.similarityThreshold = Number(document.getElementById("cfgSimilarityInput").value) || 65;
      appConfig.fallback = document.getElementById("cfgFallbackInput").value;

      localStorage.setItem(STORAGE_KEY_CFG, JSON.stringify(appConfig));
      chatInput.placeholder = appConfig.placeholder;
      showToast("Configurações salvas!");
    });

    document.getElementById("btnClearChat").addEventListener("click", () => {
      chatHistory = [];
      saveChat();
      renderChat();
      menuModal.classList.remove("open");
      showToast("Conversa limpa!");
    });

    // Exportar / Importar Backup
    document.getElementById("btnExportData").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ qaDatabase, appConfig }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "backup_assistente.json";
      a.click();
    });

    document.getElementById("btnImportTrigger").addEventListener("click", () => {
      document.getElementById("importFileInput").click();
    });

    document.getElementById("importFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (Array.isArray(parsed.qaDatabase)) {
            qaDatabase = parsed.qaDatabase;
            localStorage.setItem(STORAGE_KEY_QA, JSON.stringify(qaDatabase));
            renderQaList();
            showToast("Backup importado!");
          }
        } catch {
          showToast("Arquivo inválido.");
        }
      };
      reader.readAsText(file);
    });

    renderChat();
    renderQaList();
  </script>
</body>
</html>
